<title>てるしのくんRUN</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #120e2a; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #2a1d55; }
  #touch {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
    padding: 0 max(12px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    justify-content: space-between; align-items: flex-end;
  }
  #touch .pad { display: flex; gap: min(12px, 3vh); pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: min(70px, 17vh); height: min(70px, 17vh); border-radius: 50%; border: 2px solid rgba(255,240,220,.7);
    background: rgba(30,20,60,.22); color: #fff6e6; font-size: 24px; font-weight: bold;
    touch-action: none; -webkit-tap-highlight-color: transparent; padding: 0;
  }
  #touch button.on { background: rgba(255,190,90,.55); }
  #touch button[data-k="jump"] { width: min(84px, 21vh); height: min(84px, 21vh); margin-bottom: min(18px, 4vh); }
  #fs {
    display: none; position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    width: 40px; height: 40px; border-radius: 10px; border: 2px solid rgba(255,240,220,.6);
    background: rgba(30,20,60,.35); color: #fff6e6; font-size: 20px; padding: 0;
  }
  #rotate {
    display: none; position: fixed; inset: 0; background: rgba(18,14,42,.94); color: #fff6e6;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; font-size: 18px; font-weight: 700;
  }
  #rotate .phone { width: 46px; height: 80px; border: 4px solid #ffc61a; border-radius: 10px; animation: turn 2.2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (pointer: coarse) {
    #touch { display: flex; }
    body.fs-ok #fs { display: block; }
  }
  @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }
</style>

// ============================================================
//  てるしのくんRUN  — ハイスピード横スクロールアクション (HTML5 Canvas)
//  舞台: 夜明け前の「あさやけ高原」。坂・ループ・はねる花を駆け抜ける。進むほど空が明けていく。
// ============================================================
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');   // 静的タイルの事前描画時だけ一時的に差し替える
const T = 32, H = 544;
let W = 960;                      // 画面の横幅は端末の縦横比に合わせて 960〜1280 で可変
const SOLID = new Set(['#', 'B', 'Q', 'M', 'U', 'S']);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ---------- 画面サイズ調整 (スマホ横持ちでは画面いっぱいに) ----------
function fit() {
  const vw = innerWidth, vh = innerHeight;
  const nw = Math.round(clamp(H * vw / vh, 960, 1280) / 2) * 2;
  if (nw !== W) { W = nw; cv.width = W; }
  const s = Math.min(vw / W, vh / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 200));
fit();

// 全画面ボタン (対応ブラウザのみ)
const fsBtn = document.getElementById('fs');
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) document.body.classList.add('fs-ok');
fsBtn.addEventListener('click', async () => {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      await (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen());
      try { await screen.orientation.lock('landscape'); } catch (e) { }
    } else await document.exitFullscreen();
  } catch (e) { }
  setTimeout(fit, 300);
});

// ---------- 入力 ----------
const keys = {}, pressed = {};
function mapKey(c) {
  switch (c) {
    case 'ArrowLeft': case 'KeyA': return 'left';
    case 'ArrowRight': case 'KeyD': return 'right';
    case 'ArrowUp': case 'KeyW': case 'Space': case 'KeyZ': return 'jump';
    case 'ShiftLeft': case 'ShiftRight': case 'KeyX': return 'run';
    case 'Enter': return 'start';
    case 'KeyP': case 'Escape': return 'pause';
    case 'KeyM': return 'mute';
  }
  return null;
}
function press(k) { if (!keys[k]) pressed[k] = true; keys[k] = true; initAudio(); }
function release(k) { keys[k] = false; }
addEventListener('keydown', e => { const k = mapKey(e.code); if (!k) return; e.preventDefault(); press(k); });
addEventListener('keyup', e => { const k = mapKey(e.code); if (!k) return; e.preventDefault(); release(k); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.classList.add('on'); press(k); if (k === 'jump') pressed.start = true; };
  const off = e => { e.preventDefault(); b.classList.remove('on'); release(k); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', () => { initAudio(); pressed.start = true; });

// ---------- サウンド (WebAudio) ----------
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.06, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination);

// ---------- 坂道タイル ----------
//  地面の高さ (タイル上端からの距離) と傾き。正の角度 = 右に向かって下り
const A2 = Math.atan(0.5);
const SLOPES = {
  '/': [lx => T - lx, -Math.PI / 4],     // 急な上り
  '\\': [lx => lx, Math.PI / 4],         // 急な下り
  'a': [lx => T - lx / 2, -A2],          // ゆるい上り (前半)
  'b': [lx => T / 2 - lx / 2, -A2],      // ゆるい上り (後半)
  'c': [lx => lx / 2, A2],               // ゆるい下り (前半)
  'd': [lx => T / 2 + lx / 2, A2],       // ゆるい下り (後半)
};
const GROUNDISH = c => c === '#' || c in SLOPES;

// ---------- ステージ構築 ----------
//  '#' 地面  '/' '\' 急な坂  'a''b' ゆるい上り  'c''d' ゆるい下り  'S' 日時計石
//  'B' くもブロック  'Q' ひかりのつぼ(しずく)  'M' ひかりのつぼ(おひさまのかけら)  'U' からっぽのつぼ
//  '^' いばら  'o' ひかりのしずく  '>' かぜの床(加速)  'J' はねる花  'K' 大はねる花
function buildLevel() {
  const LW = 262, LH = 17;
  const g = Array.from({ length: LH }, () => Array(LW).fill(' '));
  const set = (x, y, c) => { if (x >= 0 && x < LW && y >= 0 && y < LH) g[y][x] = c; };
  const fill = (x0, x1, y0, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, c); };
  const col = (x, y0) => fill(x, x, y0, 16, '#');
  const ground = (a, b) => fill(a, b, 15, 16, '#');
  const plateau = (a, b, row) => fill(a, b, row, 16, '#');
  const upSteep = (x, row, n) => { for (let i = 0; i < n; i++) { set(x + i, row - i, '/'); col(x + i, row - i + 1); } };
  const downSteep = (x, row, n) => { for (let i = 0; i < n; i++) { set(x + i, row + i, '\\'); col(x + i, row + i + 1); } };
  const upGentle = (x, row, n) => { for (let i = 0; i < n; i++) { set(x + 2 * i, row - i, 'a'); set(x + 2 * i + 1, row - i, 'b'); col(x + 2 * i, row - i + 1); col(x + 2 * i + 1, row - i + 1); } };
  const downGentle = (x, row, n) => { for (let i = 0; i < n; i++) { set(x + 2 * i, row + i, 'c'); set(x + 2 * i + 1, row + i, 'd'); col(x + 2 * i, row + i + 1); col(x + 2 * i + 1, row + i + 1); } };
  const drops = (a, b, y) => fill(a, b, y, y, 'o');
  const en = [], pl = [], loops = [];
  const E = (tx, type = 'gloom', ty = 14) => en.push({ tx, ty, type });
  const PF = (tx, ty, w, axis, range, speed, phase = 0) => pl.push({ x: tx * T, y: ty * T, w, axis, range: range * T, speed, phase });
  const LOOP = tx => loops.push({ cx: tx * T + T / 2, cy: 15 * T - 104, r: 104 });

  // A: はじまりの丘 — ゆるやかな起伏で助走
  ground(0, 64);
  fill(10, 13, 11, 11, 'B'); set(11, 11, 'Q'); set(12, 11, 'Q');
  drops(15, 17, 13);
  upGentle(18, 14, 2); plateau(22, 25, 13); downGentle(26, 13, 2);
  drops(19, 29, 10);
  upGentle(32, 14, 1); plateau(34, 35, 14); downGentle(36, 14, 1);
  set(41, 14, '>'); set(42, 14, '>');
  // B: ひかりの輪 (ループ) — かぜの床で勢いをつけて一回転
  LOOP(52);
  set(52, 9, 'o'); set(49, 10, 'o'); set(55, 10, 'o');
  // C: 台地を駆け上がって、谷を跳び越え、一気に駆け下りる
  upSteep(64, 14, 5);
  plateau(69, 76, 10); drops(70, 75, 8);
  E(74, 'gloom', 9);
  // 谷 77-80
  plateau(81, 90, 10); set(85, 6, 'M');
  E(88, 'gloom', 9);
  downSteep(91, 10, 5);
  ground(96, 164);
  set(97, 14, '>'); set(98, 14, '>');
  drops(100, 104, 13);
  // D: 大はねる花で上の道へ / そのまま下の道へ
  set(106, 14, 'K');
  fill(116, 133, 8, 9, '#');
  drops(117, 132, 7); set(123, 4, 'Q'); set(127, 4, 'M');
  E(118); E(122, 'thorn'); E(128);
  // 中間地点 136
  // E: 起伏の連続
  upGentle(141, 14, 2); plateau(145, 146, 13); downGentle(147, 13, 2);
  drops(142, 150, 10);
  upGentle(151, 14, 2); plateau(155, 156, 13); downGentle(157, 13, 2);
  drops(152, 160, 10);
  E(149); E(159, 'thorn');
  // F: 空の裂け目 (浮き岩)
  PF(167, 12, 3, 'x', 1.5, 1.2);
  fill(173, 174, 11, 16, 'S'); drops(173, 174, 10);
  PF(177, 10, 3, 'y', 3, 1.0);
  drops(177, 179, 5);
  PF(181, 12, 3, 'x', 1, 1.4, 1.5);
  // G: かぜの床 → 2つめのループ → 大はねる花で崖の上へ → 最後の下り坂 → 日の出の祭壇
  ground(185, LW - 1);
  drops(186, 188, 13);
  set(191, 14, '>'); set(192, 14, '>');
  LOOP(200);
  set(200, 9, 'o'); set(197, 10, 'o'); set(203, 10, 'o');
  set(210, 14, 'K');
  plateau(217, 224, 9); drops(218, 223, 7);
  E(221, 'gloom', 8);
  downSteep(225, 9, 6);
  set(232, 14, '>'); set(233, 14, '>');
  drops(236, 244, 13);
  return { grid: g, LW, LH, enemies: en, plats: pl, loops, goalX: 252, goalY: 15 * T, cpX: 136 };
}

// ---------- ゲーム状態 ----------
const G = { mode: 'title', score: 0, drops: 0, lives: 3, time: 300, checkpoint: false, frame: 0, paused: false, wait: 0 };
let L, P;

function loadLevel() {

    plats: lv.plats.map(p => ({ ...p, ox: p.x, oy: p.y, t: 0, dx: 0, dy: 0 })),

// 変化しないタイル (地面・坂・日時計石) は 32 列ずつ画像に事前描画して軽くする
const STATIC = c => c === '#' || c === 'S' || c in SLOPES;
const CHUNK = 32;
let chunks = [];
function chunkCanvas(i) {
  if (!chunks[i]) {
    const c = document.createElement('canvas');
    c.width = CHUNK * T; c.height = L.LH * T;
    const main = ctx;
    ctx = c.getContext('2d');
    for (let ty = 0; ty < L.LH; ty++) for (let tx = i * CHUNK; tx < Math.min(L.LW, (i + 1) * CHUNK); tx++)
      if (STATIC(L.grid[ty][tx])) drawTile(L.grid[ty][tx], (tx - i * CHUNK) * T, ty * T, tx, ty);
    ctx = main;

  }

}
const HERO_H = 78;                // 主人公の見た目の身長 (px)
function makePlayer(tx) {

           coyote: 0, jumpBuf: 0, walk: 0, star: 0, hurt: 0, dead: false, plat: null, combo: 0, lastBottom: 0,
           hidden: false, jumped: false, spring: false, loop: null, rot: 0 };
}
function makeEnemy(d) {

  return { type: d.type, x: d.tx * T + 2, y: (d.ty + 1) * T - h, w, h, vx: d.type === 'thorn' ? -1.1 : -0.8, vy: 0,
           active: false, state: null, t: 0, anim: hash(d.tx) * 6, onGround: false, hitWall: 0, ang: 0 };
}
function newGame() {

  startLevel();
}
function startLevel() {
  loadLevel();
  P = makePlayer(G.checkpoint ? L.cpX : 8);   // スタート位置は左下のボタンに隠れない所
  G.drops = 0;

// ---------- ユーティリティ ----------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function tile(tx, ty) {
  if (tx < 0 || tx >= L.LW) return 'S';
  if (ty < 0 || ty >= L.LH) return ' ';
  return L.grid[ty][tx];
}
const solidAt = (tx, ty) => SOLID.has(tile(tx, ty));
function addScore(n, x, y) { G.score += n; if (x !== undefined) L.pops.push({ x, y, text: String(n), t: 50 }); }
function addDrop() {
  G.drops++; sfx.drop();
  if (G.drops % 100 === 0) oneUp();
}
function oneUp() { G.lives++; sfx.oneup(); L.pops.push({ x: P.x, y: P.y - 10, text: '1UP', t: 70, color: '#9dffb0' }); }
function puff(cx, cy, n = 7, color = '#fff') {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    L.parts.push({ kind: 'puff', x: cx, y: cy, vx: Math.cos(a) * 1.6, vy: Math.sin(a) * 1.2 - 0.6, r: 6 + hash(i + cx) * 4, t: 32, c: color });
  }
}

// 足もとの地面を探す: x の列で、足の少し上 (段差・坂の上り分) から下に向かって最初の面
const STEP = 16;
function surfaceAt(x, yTop, yBot) {
  const tx = Math.floor(x / T);
  for (let ty = Math.floor(yTop / T); ty <= Math.floor(yBot / T); ty++) {
    const c = tile(tx, ty);
    let y, ang = 0, slope = false;
    if (SOLID.has(c)) y = ty * T;
    else if (c in SLOPES) { y = ty * T + SLOPES[c][0](x - tx * T); ang = SLOPES[c][1]; slope = true; }
    else continue;
    if (y < yTop) return null;          // 壁の中 (横の判定にまかせる)
    if (y > yBot) return null;
    return { y, ang, slope };
  }
  return null;
}

// タイルとの当たり判定つき移動 (坂道・小さな段差を乗り越える)
function moveBody(b, onHitCeil) {
  const wasGround = b.onGround;
  b.hitWall = 0;
  b.x += b.vx;
  const top = Math.floor(b.y / T), bot = Math.floor((b.y + b.h - 1 - STEP) / T);
  if (b.vx > 0) {
    const tx = Math.floor((b.x + b.w - 1) / T);
    for (let ty = top; ty <= bot; ty++) if (solidAt(tx, ty)) { b.x = tx * T - b.w; b.vx = 0; b.hitWall = 1; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x / T);
    for (let ty = top; ty <= bot; ty++) if (solidAt(tx, ty)) { b.x = (tx + 1) * T; b.vx = 0; b.hitWall = -1; break; }
  }
  b.y += b.vy; b.onGround = false;
  if (b.vy >= 0) {
    const fy = b.y + b.h;
    const snap = wasGround ? 6 + Math.abs(b.vx) * 1.1 : 0;
    const xs = [b.x + 3, b.x + b.w / 2, b.x + b.w - 3];
    const center = surfaceAt(xs[1], fy - STEP, fy + snap + 1);
    let best = center && center.slope ? center : null;
    if (!best) for (const sx of xs) {
      const s = surfaceAt(sx, fy - STEP, fy + snap + 1);
      if (s && (!best || s.y < best.y)) best = s;
    }
    if (best && (best.y <= fy || wasGround)) {
      b.y = best.y - b.h; b.vy = 0; b.onGround = true; b.ang = best.ang;
    } else b.ang = 0;
  } else {
    b.ang = 0;
    const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - 1) / T);
    const ty = Math.floor(b.y / T);
    const hit = [];
    for (let tx = l; tx <= r; tx++) if (solidAt(tx, ty)) hit.push(tx);
    if (hit.length === 1 && onHitCeil) {
      // 角に少しだけ引っかかった時はするっと横にずらす
      const tx = hit[0];
      const ovL = b.x + b.w - tx * T, ovR = (tx + 1) * T - b.x;
      if (ovL <= 8 && !solidAt(tx - 1, ty)) { b.x = tx * T - b.w; return; }
      if (ovR <= 8 && !solidAt(tx + 1, ty)) { b.x = (tx + 1) * T; return; }
    }
    if (hit.length) {
      b.y = (ty + 1) * T; b.vy = 0;
      if (onHitCeil) {
        const cx = b.x + b.w / 2;
        hit.sort((a, c) => Math.abs(a * T + T / 2 - cx) - Math.abs(c * T + T / 2 - cx));
        onHitCeil(hit[0], ty);
      }
    }
  }
}

// 下からブロックを叩いた
function bumpTile(tx, ty) {
  const t = tile(tx, ty);
  const key = tx + ',' + ty;
  if (t === 'Q') {
    L.grid[ty][tx] = 'U'; L.bumps.set(key, 10);
    L.items.push({ kind: 'droppop', x: tx * T + 8, y: ty * T - 24, vy: -9, t: 28 });
    for (let i = 0; i < 5; i++) addDrop();
    addScore(200, tx * T + 4, ty * T - 30);
  } else if (t === 'M') {
    L.grid[ty][tx] = 'U'; L.bumps.set(key, 10);
    L.items.push({ kind: 'sun', x: tx * T + 6, y: ty * T, w: 20, h: 20, vx: 0, vy: 0, rise: 22, onGround: false, hitWall: 0 });
    sfx.appear();
  } else if (t === 'B') {
    L.grid[ty][tx] = ' ';
    puff(tx * T + 16, ty * T + 16, 8, '#ffe6f3');
    addScore(50); sfx.puff();
  } else { sfx.bump(); }
  for (const e of L.enemies) {
    if (e.active && !e.state && e.x + e.w > tx * T && e.x < tx * T + T && Math.abs(e.y + e.h - ty * T) < 6) {
      flipKill(e); addScore(200, e.x, e.y);
    }
  }
  if (tile(tx, ty - 1) === 'o') {
    L.grid[ty - 1][tx] = ' ';
    L.items.push({ kind: 'droppop', x: tx * T + 8, y: (ty - 1) * T, vy: -9, t: 28 });
    addDrop(); addScore(100);
  }
}
function flipKill(e) { e.state = 'flip'; e.vy = -6; e.vx = (P.x < e.x ? 1.5 : -1.5); sfx.kick(); puff(e.x + e.w / 2, e.y + e.h / 2, 5, '#b8a6d9'); }

// ダメージ: しずくを持っていれば、まき散らして耐える。0 個ならミス
function hurtPlayer() {
  if (P.dead || P.hurt > 0 || P.star > 0) return;
  if (G.drops <= 0) { killPlayer(); return; }
  const n = Math.min(G.drops, 16);
  G.drops = 0;
  const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i / (n - 1 || 1) - 0.5) * Math.PI * 1.4;
    const s = 3 + (i % 3);
    L.items.push({ kind: 'lost', x: cx - 8, y: cy - 8, w: 16, h: 16, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, b: 6, t: 200, wait: 30, onGround: false, hitWall: 0 });
  }
  P.hurt = 120; P.vy = -6; P.vx = -P.face * 3; P.onGround = false; P.loop = null; P.jumped = false;
  sfx.hurt();
}
function killPlayer() {
  if (P.dead) return;
  P.dead = true; P.vy = -10; P.vx = 0; P.deadT = 0; P.star = 0; P.loop = null; P.rot = 0;

// ---------- 更新 ----------
function updatePlats() {
  for (const p of L.plats) {
    p.t += 1 / 60;
    const ox = p.x, oy = p.y;
    const s = Math.sin(p.t * p.speed + p.phase) * p.range;
    if (p.axis === 'x') p.x = p.ox + s; else p.y = p.oy + s;
    p.dx = p.x - ox; p.dy = p.y - oy;
  }
}

// ループ (ひかりの輪) の中を走る
function updateLoop() {
  const p = P, lp = p.loop;
  lp.speed = Math.max(5.5, lp.speed - 0.3 * Math.sin(lp.th));
  lp.th += lp.speed / lp.L.r;
  if (lp.th >= Math.PI * 2) {
    const l = lp.L;
    p.loop = null; p.rot = 0;
    p.x = l.cx - p.w / 2 + 1; p.y = l.cy + l.r - p.h; p.vx = lp.speed; p.vy = 0; p.onGround = true;
    return;
  }
  const l = lp.L;
  const fx = l.cx + l.r * Math.sin(lp.th), fy = l.cy + l.r * Math.cos(lp.th);
  p.feetX = fx; p.feetY = fy; p.rot = -lp.th;
  const bx = fx - Math.sin(lp.th) * p.h / 2, by = fy - Math.cos(lp.th) * p.h / 2;
  p.x = bx - p.w / 2; p.y = by - p.h / 2;
  p.walk += lp.speed * 0.1;
  collectDrops(p);
}

function collectDrops(p) {
  const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 1) / T);
  const tp = Math.floor(p.y / T), bt = Math.floor((p.y + p.h - 1) / T);
  for (let ty = tp; ty <= bt; ty++) for (let tx = l; tx <= r; tx++) {
    if (tile(tx, ty) === 'o') { L.grid[ty][tx] = ' '; addDrop(); G.score += 10; }
  }
}

function updatePlayer() {
  const p = P;
  if (p.hurt > 0) p.hurt--;
  if (p.star > 0) {
    p.star--;
    if (G.frame % 3 === 0) L.parts.push({ kind: 'spark', x: p.x + Math.random() * p.w, y: p.y + Math.random() * p.h, vx: 0, vy: -0.6, t: 30 });
  }
  if (p.loop) { updateLoop(); return; }

  const max = keys.run ? 8 : 6;
  const dir = p.hurt > 95 ? 0 : (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (p.onGround) {
    if (dir) {
      if (dir * p.vx < 0) p.vx += dir * 0.5;                  // 切り返し (ブレーキ)
      else if (Math.abs(p.vx) < max) p.vx += dir * (Math.abs(p.vx) < 3 ? 0.22 : 0.12);
      p.face = dir;
    } else {
      p.vx -= Math.sign(p.vx) * Math.min(Math.abs(p.vx), 0.12);
    }
    p.vx += Math.sin(p.ang) * 0.3;                            // 坂道で加速・減速
    if (Math.abs(p.vx) > max && !p.boost) p.vx -= Math.sign(p.vx) * 0.04;
  } else {
    if (dir) { if (Math.abs(p.vx) < max || dir * p.vx < 0) p.vx += dir * 0.14; p.face = dir; }
  }
  p.vx = clamp(p.vx, -12, 12);
  if (p.boost > 0) p.boost--;

  // ジャンプ (先行入力 + コヨーテタイム)
  if (pressed.jump) p.jumpBuf = 8; else if (p.jumpBuf > 0) p.jumpBuf--;
  if (p.onGround) p.coyote = 6; else if (p.coyote > 0) p.coyote--;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -10.5;
    p.jumpBuf = 0; p.coyote = 0; p.onGround = false; p.plat = null; p.jumped = true; p.spring = false;
    sfx.jump();
  }
  p.vy += (keys.jump && p.vy < 0 && !p.spring) ? 0.36 : 0.72;
  if (p.vy > 12) p.vy = 12;

  if (p.plat) { p.x += p.plat.dx; p.y += p.plat.dy; }
  const prevBottom = p.y + p.h;
  const prevCx = p.x + p.w / 2;
  p.lastBottom = prevBottom;
  moveBody(p, bumpTile);
  p.plat = null;
  for (const pl of L.plats) {
    if (p.vy >= 0 && prevBottom <= pl.y + 2 && p.y + p.h >= pl.y && p.x + p.w > pl.x && p.x < pl.x + pl.w * T) {
      p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.plat = pl; p.ang = 0;
    }
  }
  if (p.onGround) { p.combo = 0; p.jumped = false; p.spring = false; }
  p.walk += p.onGround ? Math.abs(p.vx) * 0.1 : 0;
  if (p.onGround && !p.vx) p.walk = 0;
  p.rot = p.onGround ? p.ang * 0.6 : 0;

  // ループの入口: 地面を右向きに十分な速さで走っていたら一回転
  if (p.onGround && p.vx >= 6.5) {
    const cx = p.x + p.w / 2;
    for (const l of L.loops) {
      if (prevCx < l.cx && cx >= l.cx && Math.abs(p.y + p.h - (l.cy + l.r)) < 6) {
        p.loop = { L: l, th: 0, speed: p.vx }; p.jumped = false; sfx.whoosh();
        updateLoop(); return;
      }
    }
  }

  // しずく・いばら・はねる花・かぜの床
  collectDrops(p);
  const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 1) / T);
  const tp = Math.floor(p.y / T), bt = Math.floor((p.y + p.h - 1) / T);
  for (let ty = tp; ty <= bt; ty++) for (let tx = l; tx <= r; tx++) {
    const c = tile(tx, ty);
    if (c === '^') {
      if (overlap(p, { x: tx * T + 3, y: ty * T + 14, w: 26, h: 18 })) hurtPlayer();
    } else if ((c === 'J' || c === 'K') && p.vy >= 0) {
      if (overlap({ x: p.x, y: p.y + p.h - 10, w: p.w, h: 10 }, { x: tx * T + 3, y: ty * T + 12, w: 26, h: 20 })) {
        p.vy = c === 'K' ? -19 : -14; p.onGround = false; p.spring = true; p.jumped = false;
        L.springs.set(tx + ',' + ty, 14); sfx.spring();
      }
    } else if (c === '>' && p.onGround) {
      if (p.vx < 11) sfx.dash();
      p.vx = Math.max(p.vx, 11); p.face = 1; p.boost = 40;
    }
  }
  if (G.mode !== 'play') return;
  // 中間地点のランタン
  if (!G.checkpoint && p.x > L.cpX * T) {
    G.checkpoint = true; sfx.check();
    L.pops.push({ x: L.cpX * T - 60, y: 11 * T, text: 'ランタンに灯がともった！', t: 90, color: '#ffe066' });
  }
  // 落下
  if (p.y > L.LH * T + 40) { killPlayer(); return; }
  // ゴール (日の出の祭壇)
  if (p.x + p.w / 2 >= L.goalX * T - 40) startGoal();
}

function updateEnemies(interact) {
  for (const e of L.enemies) {
    if (!e.active) { if (e.x < L.camX + W + 48) e.active = true; else continue; }
    if (e.state === 'squash') { e.t--; continue; }
    if (e.state === 'flip') { e.vy += 0.5; e.y += e.vy; e.x += e.vx; continue; }
    const vx0 = e.vx;
    e.vy = Math.min(e.vy + 0.5, 10);
    moveBody(e);
    if (e.hitWall) e.vx = -vx0;
    else if (e.type === 'thorn' && e.onGround) {
      const fx = vx0 > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!surfaceAt(fx, e.y + e.h - STEP, e.y + e.h + 18)) e.vx = -vx0;
    }
    if (e.vx === 0) e.vx = -vx0;
    e.anim += e.vx * 0.09;
  }
  // 敵同士はぶつかったら反転
  const alive = L.enemies.filter(e => e.active && !e.state);
  for (let i = 0; i < alive.length; i++) for (let j = i + 1; j < alive.length; j++) {
    const a = alive[i], b = alive[j];
    if (overlap(a, b)) {
      a.vx = (a.x < b.x ? -1 : 1) * Math.abs(a.vx);
      b.vx = (b.x < a.x ? -1 : 1) * Math.abs(b.vx);
    }
  }
  if (interact && !P.dead) {
    for (const e of alive) {
      if (e.state || !overlap(P, e)) continue;
      const attack = P.loop || P.star > 0 || (e.type !== 'thorn' && ((P.jumped && !P.onGround) || (P.vy > 0 && P.lastBottom <= e.y + 12)));
      if (attack) {
        if (P.star > 0 || P.loop) { flipKill(e); addScore(200, e.x, e.y); continue; }
        e.state = 'squash'; e.t = 30;
        if (P.vy > 0) P.vy = keys.jump ? -10 : -7;
        const pts = [100, 200, 400, 800, 1000, 2000, 4000, 8000];
        if (P.combo >= pts.length) oneUp(); else addScore(pts[P.combo], e.x, e.y - 10);
        P.combo++;
        puff(e.x + e.w / 2, e.y + e.h / 2, 5, '#b8a6d9');
        sfx.stomp();
      } else { hurtPlayer(); if (P.dead) return; }
    }
  }
  L.enemies = L.enemies.filter(e => !(e.state === 'squash' && e.t <= 0) && e.y < L.LH * T + 100);
}

function updateItems() {
  for (const it of L.items) {
    if (it.kind === 'droppop') { it.vy += 0.6; it.y += it.vy; it.t--; if (it.t <= 0) it.dead = true; continue; }
    if (it.kind === 'lost') {
      it.vy = Math.min(it.vy + 0.3, 9);
      const vx0 = it.vx;
      moveBody(it);
      if (it.hitWall) it.vx = -vx0 * 0.6;
      if (it.onGround) { it.vy = -it.b; it.b *= 0.7; it.onGround = false; it.vx *= 0.9; }
      if (it.wait > 0) it.wait--;
      else if (G.mode === 'play' && !P.dead && overlap(P, it)) { it.dead = true; addDrop(); }
      if (--it.t <= 0 || it.y > L.LH * T + 50) it.dead = true;
      continue;
    }
    if (it.kind === 'sun') {
      if (it.rise > 0) { it.y -= 1; if (--it.rise === 0) it.vx = 1.8; }
      else {
        const vx0 = it.vx;
        it.vy = Math.min(it.vy + 0.4, 10);
        moveBody(it);
        if (it.hitWall) it.vx = -vx0;
        if (it.onGround) { it.vy = -6; it.onGround = false; }
      }
      if (G.mode === 'play' && !P.dead && overlap(P, it)) {
        it.dead = true; P.star = 600;
        addScore(1000, it.x, it.y); sfx.power();
      }
      if (it.y > L.LH * T + 50) it.dead = true;
    }
  }
  L.items = L.items.filter(i => !i.dead);
}

function updateParts() {
  for (const p of L.parts) {
    p.x += p.vx; p.y += p.vy; p.t--;
    if (p.kind === 'puff') { p.vx *= 0.92; p.vy *= 0.92; p.r += 0.35; }
  }
  L.parts = L.parts.filter(p => p.t > 0 && p.y < H + 40);
  for (const s of L.pops) { s.y -= 0.8; s.t--; }
  L.pops = L.pops.filter(s => s.t > 0);
  for (const m of [L.bumps, L.springs]) for (const [k, v] of m) { if (v <= 1) m.delete(k); else m.set(k, v - 1); }
}

function updateCamera() {
  // 速く走るほど進行方向の先を見せる
  const vx = P.loop ? P.loop.speed * 0.3 : P.vx;
  L.look += (clamp(vx * 22, -160, 220) - L.look) * 0.04;
  const target = P.x + P.w / 2 - W * 0.38 + L.look;
  L.camX += (target - L.camX) * 0.2;
  L.camX = clamp(L.camX, 0, L.LW * T - W);
}

// ゴール: 祭壇の中央まで歩く → 光の柱 → 主人公が朝日のように昇る → 夜が明ける
function startGoal() {
  G.mode = 'goal'; L.goalPhase = 0; L.goalT = 0;
  P.star = 0; P.hurt = 0; P.boost = 0;
  bgmStop(); tone(1047, 0.5, 'triangle', 0.1, 523);
}
function updateGoal() {
  const p = P;
  const cx = L.goalX * T + T / 2;
  if (L.goalPhase === 0) {
    const d = cx - (p.x + p.w / 2);
    p.face = d >= 0 ? 1 : -1;
    p.vx = Math.abs(d) < 60 ? clamp(d, -2.2, 2.2) : p.vx * 0.94 + Math.sign(d) * 0.1;
    p.vy = Math.min(p.vy + 0.72, 12);
    moveBody(p); p.walk += Math.abs(p.vx) * 0.1; p.rot = 0;
    if (Math.abs(d) < 1.5 && p.onGround) { p.x = cx - p.w / 2; p.vx = 0; p.walk = 0; p.face = 1; L.goalPhase = 1; L.goalT = 50; }
  } else if (L.goalPhase === 1) {
    L.beam = 1 - L.goalT / 50;
    if (--L.goalT <= 0) { L.goalPhase = 2; L.goalT = 160; sfx.sunrise(); }
  } else if (L.goalPhase === 2) {
    p.y -= 0.55; p.onGround = true;
    L.sunrise = 1 - L.goalT / 160;
    if (G.frame % 2 === 0) L.parts.push({ kind: 'spark', x: cx - 40 + Math.random() * 80, y: p.y + Math.random() * 80, vx: 0, vy: -1, t: 40 });
    if (--L.goalT <= 0) {
      L.goalPhase = 3; L.goalT = 30;
      L.pops.push({ x: cx - 50, y: p.y - 20, text: '夜明けだ！', t: 120, color: '#fff3b0' });
    }
  } else if (L.goalPhase === 3) {
    if (L.goalT > 0) L.goalT--;
    else if (G.time > 0 || G.drops > 0) {
      if (G.time > 0) { const n = Math.min(G.time, 2); G.time -= n; G.score += 50 * n; }
      else { const n = Math.min(G.drops, 2); G.drops -= n; G.score += 100 * n; }
      if (G.frame % 3 === 0) sfx.tick();
    } else { L.goalPhase = 4; L.goalT = 50; }
  } else if (L.goalPhase === 4) {
    if (--L.goalT <= 0) { G.mode = 'clear'; G.wait = 40; }
  }
}

function update() {
  G.frame++;
  if (pressed.mute) muted = !muted;
  switch (G.mode) {
    case 'title':
      if (!L) loadLevel();
      L.camX = (Math.sin(G.frame / 500) * 0.5 + 0.5) * 1200;
      updatePlats();
      if (pressed.start || pressed.jump) { initAudio(); newGame(); }
      break;
    case 'play':
      if (pressed.pause) G.paused = !G.paused;
      if (G.paused) break;
      updatePlats();
      updatePlayer();
      if (G.mode === 'play') updateEnemies(true);
      updateItems(); updateParts(); updateCamera();
      if (G.mode === 'play' && ++G.timeAcc >= 60) {
        G.timeAcc = 0; G.time--;
        if (G.time === 60) { tone(880, 0.3, 'square', 0.06); tone(880, 0.3, 'square', 0.06, null, 0.35); }
        if (G.time <= 0) { G.time = 0; killPlayer(); }
      }
      break;
    case 'dying':
      P.deadT++;
      if (P.deadT > 30) { P.vy += 0.5; P.y += P.vy; }
      updateParts();
      if (P.deadT > 150) {
        G.lives--;
        if (G.lives <= 0) { G.mode = 'gameover'; G.wait = 60; }
        else startLevel();
      }
      break;
    case 'goal':
      updatePlats(); updateGoal(); updateEnemies(false); updateItems(); updateParts(); updateCamera();
      break;
    case 'gameover':
    case 'clear':
      updatePlats(); updateParts();
      if (G.mode === 'clear' && G.frame % 14 === 0) {
        L.parts.push({ kind: 'petal', x: L.camX + Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 1.2, vy: 1.2 + Math.random() * 1.5,
          t: 420, c: ['#ffb36b', '#ffd23f', '#ff8fb1', '#fff3b0'][Math.floor(Math.random() * 4)] });
      }
      if (G.wait > 0) G.wait--;
      else if (pressed.start || pressed.jump) { G.mode = 'title'; loadLevel(); }
      break;
  }
  bgmTick();
  for (const k in pressed) delete pressed[k];
}

// ---------- 描画: 主人公 (元イラストを切り分けたパーツで描画) ----------
const HERO_IMG = {};
for (const k in HERO_SRC) { const im = new Image(); im.src = HERO_SRC[k]; HERO_IMG[k] = im; }
const heroReady = () => Object.values(HERO_IMG).every(i => i.complete && i.naturalWidth > 0);
function drawHero(x, y, o) {
  if (!heroReady()) return;
  const k = (o.scale || 1) * HERO_H / HERO_META.height;
  const px = HERO_META.height / HERO_H;            // ゲーム内 1px をパーツ座標に換算
  const M = HERO_META.parts, PV = HERO_META.pivots;
  const sw = o.air ? 0 : Math.sin(o.walk || 0);
  const bob = o.air ? 0 : -Math.abs(sw) * 1.4 * px;
  ctx.save();
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(k * (o.face || 1), k);
  if (o.glow) {
    ctx.shadowColor = 'rgba(255,200,40,0.95)'; ctx.shadowBlur = 20;
    ctx.filter = `brightness(${1.1 + Math.sin(G.frame * 0.4) * 0.07})`;
  } else { ctx.shadowColor = 'rgba(255,170,40,0.5)'; ctx.shadowBlur = 8; }
  const part = (n, dx = 0, dy = 0) => ctx.drawImage(HERO_IMG[n], M[n][0] + dx, M[n][1] + dy);
  // 腕 (肩を軸に回転・胴の後ろ側に描く)
  for (const [n, s] of [['armL', 1], ['armR', -1]]) {
    const a = o.air ? 0.38 : sw * 0.14 * s;
    const [pvx, pvy] = PV[n];
    ctx.save(); ctx.translate(pvx, pvy + bob); ctx.rotate(a * s);
    ctx.drawImage(HERO_IMG[n], M[n][0] - pvx, M[n][1] - pvy);
    ctx.restore();
  }
  // 足 (交互に持ち上げる)
  for (const [n, i] of [['legL', -1], ['legR', 1]]) {
    const lift = o.air ? (i < 0 ? 4 : 0.5) : Math.max(0, sw * i) * 3.5;
    part(n, (o.air ? 0 : sw * i * 0.9) * px, -lift * px);
  }
  part('torso', 0, bob);
  ctx.drawImage(HERO_IMG[o.dead ? 'headDead' : o.happy ? 'headHappy' : 'head'], M.head[0], M.head[1] + bob);
  ctx.restore();
}

// ---------- 描画: 敵・アイテム ----------
function drawEnemy(e, camX) {
  const x = Math.round(e.x - camX), y = Math.round(e.y);
  ctx.save();
  ctx.translate(x + e.w / 2, y + e.h);
  if (e.state === 'squash') ctx.scale(1.2, 0.35);
  if (e.state === 'flip') { ctx.scale(1, -1); ctx.translate(0, e.h); }
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#1a1226'; ctx.lineJoin = 'round';
  if (e.type === 'gloom') {
    // どんよりぐも: 朝を嫌う雨雲
    const step = Math.sin(G.frame * 0.25 + e.anim) > 0;
    ctx.fillStyle = '#1a1226';
    ctx.beginPath(); ctx.ellipse(-7, -2 - (step ? 2 : 0), 5, 3, 0, 0, Math.PI * 2); ctx.ellipse(7, -2 - (step ? 0 : 2), 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5d4f80';
    ctx.beginPath();
    ctx.arc(-8, -11, 8, Math.PI * 0.5, Math.PI * 1.5);
    ctx.arc(-3, -19, 8, Math.PI, Math.PI * 1.8);
    ctx.arc(6, -18, 8, Math.PI * 1.2, Math.PI * 2);
    ctx.arc(9, -10, 7, Math.PI * 1.5, Math.PI * 0.5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-5, -13, 3.5, 4, 0, 0, Math.PI * 2); ctx.ellipse(5, -13, 3.5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1226';
    const lk = e.vx < 0 ? -1.2 : 1.2;
    ctx.beginPath(); ctx.arc(-5 + lk, -12, 1.8, 0, Math.PI * 2); ctx.arc(5 + lk, -12, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9, -19); ctx.lineTo(-2, -16); ctx.moveTo(9, -19); ctx.lineTo(2, -16); ctx.stroke();
    if (!e.state) { ctx.fillStyle = '#7fb8ff'; const d = (G.frame + e.anim * 10) % 20; ctx.fillRect(-2, -2 + d * 0.2, 2, 3); }
  } else {
    // トゲトゲ (踏めない)
    ctx.translate(0, -13);
    ctx.save(); ctx.rotate(e.anim);
    ctx.fillStyle = '#c9c9d6';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(0, -17); ctx.lineTo(4, -10); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#e8503a';
    ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    const lk = e.vx < 0 ? -2 : 2;
    ctx.beginPath(); ctx.ellipse(-4 + lk, -2, 3, 3.6, 0, 0, Math.PI * 2); ctx.ellipse(4 + lk, -2, 3, 3.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1226';
    ctx.beginPath(); ctx.arc(-4 + lk * 1.4, -1.5, 1.6, 0, Math.PI * 2); ctx.arc(4 + lk * 1.4, -1.5, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ひかりのしずく (この世界の通貨)
function drawDrop(cx, cy, s = 1) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,210,110,0.28)';
  ctx.beginPath(); ctx.arc(0, 1, 12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -11);
  ctx.bezierCurveTo(5, -4, 8, 0, 8, 4);
  ctx.bezierCurveTo(8, 9, 4, 11, 0, 11);
  ctx.bezierCurveTo(-4, 11, -8, 9, -8, 4);
  ctx.bezierCurveTo(-8, 0, -5, -4, 0, -11);
  ctx.fillStyle = '#ffc93c'; ctx.fill();
  ctx.strokeStyle = '#b8620f'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = '#fff8d6';
  ctx.beginPath(); ctx.ellipse(-3, 3, 2, 3.5, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSunIcon(cx, cy, r, color) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = color;
  for (let i = 0; i < 8; i++) {
    ctx.rotate(Math.PI / 4);
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.9); ctx.lineTo(0, -r * 1.5); ctx.lineTo(r * 0.3, -r * 0.9); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawItem(it, camX) {
  const x = it.x - camX;
  if (it.kind === 'droppop') { drawDrop(x + 8, it.y + 8, 0.8); return; }
  if (it.kind === 'lost') { if (it.t > 60 || G.frame % 6 < 4) drawDrop(x + 8, it.y + 8, 0.7); return; }
  if (it.kind === 'sun') {
    // おひさまのかけら (無敵アイテム)
    const cx = x + 10, cy = it.y + 10;
    ctx.save(); ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 14;
    drawSunIcon(cx, cy, 8, '#ff9d1a');
    ctx.restore();
    ctx.fillStyle = '#ffe36b'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2a00';
    ctx.fillRect(cx - 3, cy - 2, 1.6, 2.6); ctx.fillRect(cx + 1.6, cy - 2, 1.6, 2.6);
    ctx.strokeStyle = '#3a2a00'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cx, cy + 1, 2.4, 0.2, Math.PI - 0.2); ctx.stroke();
  }
}

// ---------- 描画: タイル ----------
const PAL = {
  crust: '#ffd2a1', crustDark: '#e9a46e', strata: ['#8c4c78', '#a25e86', '#7a3f6c', '#965380'], gem: '#ffd36e',
  cloud: '#ffe9f4', cloudShade: '#e6b6d4', glassFrame: '#3b6b7a', glassFrameUsed: '#4a4d63',
  stone: '#dba57c', stoneDark: '#a8704f', stoneLight: '#f3c9a2', bramble: '#4b2350', thorn: '#ff86b8',
};
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawTile(c, x, y, tx, ty) {
  switch (c) {
    case '#': { // あさやけ岩: 波打つ地層 + 砂色の表土
      const top = !GROUNDISH(tile(tx, ty - 1)), lE = !GROUNDISH(tile(tx - 1, ty)), rE = !GROUNDISH(tile(tx + 1, ty));
      const bot = ty < L.LH - 1 && !GROUNDISH(tile(tx, ty + 1));
      const rounded = (top && (lE || rE)) || (bot && (lE || rE));
      if (rounded) { ctx.save(); rr(x, y, T, T, [top && lE ? 12 : 0, top && rE ? 12 : 0, bot && rE ? 12 : 0, bot && lE ? 12 : 0]); ctx.clip(); }
      drawStrata(x, y, tx, ty);
      const above = tile(tx, ty - 1);
      if (above in SLOPES) {   // 坂のすぐ下: 坂の表土の続きを描く
        const f = SLOPES[above][0];
        ctx.save(); ctx.beginPath(); ctx.rect(x, y, T, T); ctx.clip();
        ctx.beginPath(); ctx.moveTo(x - 4, y - T + f(-4)); ctx.lineTo(x + T + 4, y - T + f(T + 4));
        ctx.lineWidth = 22; ctx.strokeStyle = PAL.crustDark; ctx.stroke();
        ctx.lineWidth = 14; ctx.strokeStyle = PAL.crust; ctx.stroke();
        ctx.restore();
      }
      if (hash(tx * 31 + ty * 17) > 0.86) {
        const gx = x + 8 + hash(tx + ty) * 14, gy = y + 12 + hash(tx * 3) * 12;
        ctx.fillStyle = PAL.gem;
        ctx.beginPath(); ctx.moveTo(gx, gy - 4); ctx.lineTo(gx + 3, gy); ctx.lineTo(gx, gy + 4); ctx.lineTo(gx - 3, gy); ctx.fill();
      }
      if (top) {
        ctx.fillStyle = PAL.crustDark; ctx.fillRect(x, y, T, 11);
        ctx.fillStyle = PAL.crust; ctx.fillRect(x, y, T, 7);
        ctx.fillStyle = PAL.crustDark;
        for (let i = 0; i < 3; i++) if (hash(tx * 7 + i) > 0.4) ctx.fillRect(x + 4 + i * 10, y + 2 + (i % 2) * 2, 3, 2);
        ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x, y, T, 2);
        // 朝つゆ
        if (hash(tx * 13 + 5) > 0.7) {
          const dx = x + 6 + hash(tx) * 18;
          ctx.fillStyle = '#c8f4ff'; ctx.beginPath(); ctx.arc(dx, y + 4, 1.8, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (rounded) ctx.restore();
      break;
    }
    case '/': case '\\': case 'a': case 'b': case 'c': case 'd': { // 坂道
      const f = SLOPES[c][0];
      ctx.save();
      ctx.beginPath(); ctx.moveTo(x, y + f(0)); ctx.lineTo(x + T, y + f(T)); ctx.lineTo(x + T, y + T); ctx.lineTo(x, y + T); ctx.closePath();
      ctx.clip();
      drawStrata(x, y, tx, ty);
      ctx.beginPath(); ctx.moveTo(x - 4, y + f(-4)); ctx.lineTo(x + T + 4, y + f(T + 4));
      ctx.lineWidth = 22; ctx.strokeStyle = PAL.crustDark; ctx.stroke();
      ctx.lineWidth = 14; ctx.strokeStyle = PAL.crust; ctx.stroke();
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
      ctx.restore();
      break;
    }
    case '>': { // かぜの床: 踏むと一気に加速
      ctx.fillStyle = '#2f5f73'; rr(x, y + 24, T, 8, 3); ctx.fill();
      const ph = (G.frame * 0.25) % 1;
      for (let i = 0; i < 2; i++) {
        const ax = x + 4 + ((i * 16 + ph * 16) % T);
        ctx.fillStyle = `rgba(140,240,255,${0.5 + 0.5 * Math.sin(G.frame * 0.3 + i)})`;
        ctx.beginPath(); ctx.moveTo(ax, y + 25); ctx.lineTo(ax + 7, y + 28); ctx.lineTo(ax, y + 31); ctx.lineTo(ax + 3, y + 28); ctx.fill();
      }
      break;
    }
    case 'J': case 'K': { // はねる花
      const s = L.springs.get(tx + ',' + ty) || 0;
      const squash = s > 8 ? (14 - s) / 6 : s / 8;            // 押しつぶされてから伸びる
      const h = 12 + (1 - squash) * 2 - (s > 8 ? 6 : -6) * squash;
      ctx.strokeStyle = '#3f8a5a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + 16, y + T); ctx.quadraticCurveTo(x + 10, y + T - h / 2, x + 16, y + T - h); ctx.stroke();
      ctx.fillStyle = '#5fbf6a';
      ctx.beginPath(); ctx.ellipse(x + 8, y + T - 4, 6, 3, -0.4, 0, Math.PI * 2); ctx.ellipse(x + 24, y + T - 4, 6, 3, 0.4, 0, Math.PI * 2); ctx.fill();
      const col = c === 'K' ? ['#ff6f91', '#ffd0dc'] : ['#ffb84d', '#ffe6b0'];
      ctx.fillStyle = col[0]; rr(x + 2, y + T - h - 8, 28, 10, 5); ctx.fill();
      ctx.fillStyle = col[1]; rr(x + 6, y + T - h - 7, 20, 4, 2); ctx.fill();
      break;
    }
    case 'B': { // くもブロック
      ctx.fillStyle = PAL.cloudShade; rr(x + 1, y + 3, T - 2, T - 3, 10); ctx.fill();
      ctx.fillStyle = PAL.cloud; rr(x + 1, y + 1, T - 2, T - 6, 10); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x + 9, y + 9, 5, 0, Math.PI * 2); ctx.arc(x + 17, y + 7, 6, 0, Math.PI * 2); ctx.arc(x + 24, y + 10, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL.cloudShade; ctx.fillRect(x + 8, y + 20, 4, 2); ctx.fillRect(x + 19, y + 18, 5, 2);
      break;
    }
    case 'Q': case 'M': case 'U': { // ひかりのつぼ (ガラスのランタン)
      const used = c === 'U';
      ctx.fillStyle = used ? PAL.glassFrameUsed : PAL.glassFrame; rr(x + 1, y + 1, T - 2, T - 2, 8); ctx.fill();
      ctx.fillStyle = used ? 'rgba(170,170,200,0.25)' : 'rgba(180,240,250,0.35)'; rr(x + 4, y + 6, T - 8, T - 10, 6); ctx.fill();
      ctx.fillStyle = used ? '#6b6f88' : '#d39a46'; ctx.fillRect(x + 7, y + 1, T - 14, 4);
      if (!used) {
        const p = 0.5 + 0.5 * Math.sin(G.frame * 0.1 + tx);
        const gr = ctx.createRadialGradient(x + 16, y + 18, 1, x + 16, y + 18, 10 + p * 2);
        gr.addColorStop(0, '#fffbe0'); gr.addColorStop(0.45, '#ffcf4a'); gr.addColorStop(1, 'rgba(255,170,40,0)');
        ctx.fillStyle = gr; ctx.fillRect(x + 4, y + 6, T - 8, T - 10);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x + 7, y + 9, 3, 10);
      break;
    }
    case 'S': { // 日時計石
      ctx.fillStyle = PAL.stoneDark; rr(x, y, T, T, 5); ctx.fill();
      ctx.fillStyle = PAL.stone; rr(x + 1, y + 1, T - 3, T - 4, 5); ctx.fill();
      ctx.fillStyle = PAL.stoneLight; ctx.fillRect(x + 4, y + 2, T - 10, 3);
      ctx.strokeStyle = PAL.stoneDark; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x + 15, y + 16, 5, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        ctx.beginPath(); ctx.moveTo(x + 15 + Math.cos(a) * 8, y + 16 + Math.sin(a) * 8); ctx.lineTo(x + 15 + Math.cos(a) * 11, y + 16 + Math.sin(a) * 11); ctx.stroke();
      }
      break;
    }
    case '^': { // いばら
      ctx.strokeStyle = PAL.bramble; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y + 27);
      ctx.bezierCurveTo(x + 8, y + 16, x + 14, y + 32, x + 20, y + 22);
      ctx.bezierCurveTo(x + 24, y + 16, x + 30, y + 24, x + 32, y + 26); ctx.stroke();
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x + 10, y + 18, 4, Math.PI, Math.PI * 2.4); ctx.stroke();
      ctx.fillStyle = PAL.thorn;
      for (const [sx, sy] of [[3, 24], [12, 21], [20, 20], [28, 23], [8, 15]]) {
        ctx.beginPath(); ctx.moveTo(x + sx - 3, y + sy + 2); ctx.lineTo(x + sx, y + sy - 8); ctx.lineTo(x + sx + 3, y + sy + 2); ctx.fill();
      }
      break;
    }
    case 'o': drawDrop(x + 16, y + 16 + Math.sin(G.frame * 0.08 + tx * 0.7) * 2.5); break;
  }
}

function drawStrata(x, y, tx, ty) {
  for (let cx = 0; cx < T; cx += 8) {
    const wx = tx * T + cx;
    const wave = Math.sin(wx * 0.045) * 5 + Math.sin(wx * 0.013) * 6;
    for (let cy = 0; cy < T; cy += 4) {
      const band = Math.floor((ty * T + cy - wave) / 9);
      ctx.fillStyle = PAL.strata[((band % 4) + 4) % 4];
      ctx.fillRect(x + cx, y + cy, 8, 4);
    }
  }
}

// ひかりの輪 (ループ)
function drawLoop(lp, camX) {
  const x = lp.cx - camX;
  if (x < -200 || x > W + 200) return;
  ctx.lineWidth = 20; ctx.strokeStyle = PAL.stoneDark;
  ctx.beginPath(); ctx.arc(x, lp.cy, lp.r + 10, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 13; ctx.strokeStyle = PAL.stone; ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = PAL.stoneLight;
  ctx.beginPath(); ctx.arc(x, lp.cy, lp.r + 6, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 20; i++) {
    const a = i / 20 * Math.PI * 2 + G.frame * 0.01;
    ctx.fillStyle = `rgba(255,224,138,${0.5 + 0.5 * Math.sin(G.frame * 0.1 + i)})`;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * (lp.r + 10), lp.cy + Math.sin(a) * (lp.r + 10), 2.2, 0, Math.PI * 2); ctx.fill();
  }
  // 足もとの台座
  ctx.fillStyle = PAL.stoneDark; rr(x - 40, lp.cy + lp.r - 4, 80, 8, 3); ctx.fill();
}

// ---------- 描画: 背景 (夜明けの空) ----------
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
const STARS = Array.from({ length: 70 }, (_, i) => ({ x: hash(i * 3.1) * 1280, y: hash(i * 7.7) * 300, r: 0.6 + hash(i * 1.3) * 1.4 }));
const MOTES = Array.from({ length: 26 }, (_, i) => ({ x: hash(i * 5.3) * 1400, y: 120 + hash(i * 2.9) * 360, s: 0.2 + hash(i * 4.1) * 0.5 }));
function dawnLevel() {
  if (!L) return 0;
  const base = clamp(L.camX / Math.max(1, L.LW * T - W), 0, 1) * 0.7;
  return lerp(base, 1, L.sunrise || 0);
}
function drawBG(camX) {
  const d = dawnLevel();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix('#1c1745', '#5aa6ef', d));
  g.addColorStop(0.45, mix('#5b3b8c', '#a8d6f7', d));
  g.addColorStop(0.8, mix('#e0708a', '#ffe4c4', d));
  g.addColorStop(1, mix('#ffb07a', '#fff4dc', d));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 星 (夜明けとともに消える)
  const sa = clamp(1 - d * 1.7, 0, 1);
  if (sa > 0) {
    for (const s of STARS) {
      if (s.x > W) continue;
      ctx.globalAlpha = sa * (0.5 + 0.5 * Math.sin(G.frame * 0.05 + s.x));
      ctx.fillStyle = '#fff6e0'; ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }
  // 地平線の朝焼け
  const sunX = W * 0.72, sunY = 470 - d * 120;
  const rg = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 420);
  rg.addColorStop(0, `rgba(255,200,120,${0.55 + d * 0.3})`); rg.addColorStop(1, 'rgba(255,160,120,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  // 横に長い朝焼け雲
  const cw = 2400;
  for (let i = 0; i < 12; i++) {
    const sx = ((hash(i * 9.1) * cw - camX * 0.1) % cw + cw) % cw - 300;
    if (sx > W + 20) continue;
    const sy = 60 + hash(i * 4.4) * 220, w = 160 + hash(i * 2.2) * 220;
    ctx.fillStyle = mix('#c86a9a', '#ffffff', d);
    ctx.globalAlpha = 0.55;
    rr(sx, sy, w, 12, 6); ctx.fill();
    rr(sx + w * 0.2, sy + 9, w * 0.7, 8, 4); ctx.fill();
    ctx.fillStyle = mix('#ffb38a', '#fff3d6', d);
    rr(sx + 10, sy, w - 30, 4, 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // 遠くの台地 (メサ)
  const mesa = (f, base, seg, seed, body, rim) => {
    const off = camX * f;
    const i0 = Math.floor(off / seg) - 1, i1 = Math.floor((off + W) / seg) + 1;
    ctx.fillStyle = body; ctx.fillRect(0, base, W, H - base);
    for (let i = i0; i <= i1; i++) {
      if (hash(i * 7 + seed) < 0.3) continue;
      const w = seg * (0.45 + hash(i * 13 + seed) * 0.6), h = 40 + hash(i * 17 + seed) * 120;
      const x = i * seg - off + (seg - w) / 2;
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.moveTo(x - 24, base + 1); ctx.lineTo(x, base - h); ctx.lineTo(x + w, base - h); ctx.lineTo(x + w + 24, base + 1); ctx.fill();
      ctx.fillStyle = rim; ctx.fillRect(x, base - h, w, 3);
      ctx.fillRect(x + w * 0.2, base - h * 0.55, w * 0.6, 2);
    }
  };
  mesa(0.12, 410, 230, 1, mix('#4a3270', '#9cb8d8', d), mix('#ff9f8a', '#fff1d0', d));
  mesa(0.28, 455, 170, 9, mix('#5e3a72', '#b7a7c9', d), mix('#ffad85', '#ffe6c2', d));
  // 手前の丘 + ひかり草
  const f = 0.5, off = camX * f, base = 500;
  const hy = x => base - 30 - Math.sin((x + off) * 0.006) * 26 - Math.sin((x + off) * 0.017) * 10;
  ctx.fillStyle = mix('#6d3f6e', '#c69aa8', d);
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, hy(x));
  ctx.lineTo(W, H); ctx.fill();
  const seg = 70;
  for (let i = Math.floor(off / seg) - 1; i <= Math.floor((off + W) / seg) + 1; i++) {
    if (hash(i * 3.3) < 0.55) continue;
    const x = i * seg - off + hash(i) * 40, y0 = hy(x), h = 18 + hash(i * 5.5) * 34;
    ctx.strokeStyle = mix('#3f2550', '#8a7090', d); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y0 + 4); ctx.quadraticCurveTo(x + 6, y0 - h / 2, x + 2, y0 - h); ctx.stroke();
    const glow = 0.5 + 0.5 * Math.sin(G.frame * 0.04 + i);
    ctx.fillStyle = `rgba(255,214,120,${0.25 + glow * 0.2})`; ctx.beginPath(); ctx.arc(x + 2, y0 - h, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(x + 2, y0 - h, 3, 0, Math.PI * 2); ctx.fill();
  }
  // ただよう光の粒
  const ma = clamp(1 - d * 1.2, 0.15, 1);
  for (const m of MOTES) {
    const x = ((m.x - camX * m.s + Math.sin(G.frame * 0.01 + m.y) * 20) % 1400 + 1400) % 1400 - 60;
    if (x > W) continue;
    const y = m.y + Math.sin(G.frame * 0.02 + m.x) * 10;
    ctx.fillStyle = `rgba(255,236,170,${ma * (0.4 + 0.4 * Math.sin(G.frame * 0.07 + m.x))})`;
    ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI * 2); ctx.fill();
  }
}

// 日の出の祭壇 (ゴール)
function drawGoal(camX) {
  const cx = L.goalX * T + T / 2 - camX, gy = L.goalY;
  if (cx < -300 || cx > W + 300) return;
  const ringY = gy - 150, R = 66;
  // 柱
  for (const s of [-1, 1]) {
    const px = cx + s * (R + 14);
    ctx.fillStyle = PAL.stoneDark; rr(px - 13, ringY - 10, 26, gy - ringY + 10, 6); ctx.fill();
    ctx.fillStyle = PAL.stone; rr(px - 11, ringY - 10, 20, gy - ringY + 8, 6); ctx.fill();
    ctx.fillStyle = PAL.stoneLight; ctx.fillRect(px - 8, ringY - 4, 4, gy - ringY - 6);
    ctx.fillStyle = PAL.stoneDark; rr(px - 17, ringY - 18, 34, 12, 4); ctx.fill();
  }
  // 光の柱
  if (L.beam > 0) {
    const bw = 34 + L.sunrise * 40;
    const bg = ctx.createLinearGradient(0, 0, 0, gy);
    bg.addColorStop(0, 'rgba(255,240,180,0)'); bg.addColorStop(1, `rgba(255,220,130,${0.55 * L.beam})`);
    ctx.fillStyle = bg; ctx.fillRect(cx - bw / 2, 0, bw, gy);
  }
  // 日輪 (リング)
  ctx.save();
  if (L.beam > 0) { ctx.shadowColor = '#ffd36e'; ctx.shadowBlur = 30 * L.beam; }
  ctx.strokeStyle = PAL.stoneDark; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.arc(cx, ringY, R, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = L.beam > 0 ? mix('#dba57c', '#ffe08a', L.beam) : PAL.stone; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.arc(cx, ringY, R, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = PAL.stoneDark;
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    ctx.save(); ctx.translate(cx + Math.cos(a) * (R + 10), ringY + Math.sin(a) * (R + 10)); ctx.rotate(a + Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(0, -9); ctx.lineTo(4, 0); ctx.fill(); ctx.restore();
  }
  // 祭壇の台
  ctx.fillStyle = PAL.stoneDark; rr(cx - 52, gy - 10, 104, 12, 4); ctx.fill();
  ctx.fillStyle = PAL.stone; rr(cx - 50, gy - 10, 100, 8, 4); ctx.fill();
  drawSunIcon(cx, gy - 6, 2.6, L.beam > 0 ? '#ffe08a' : PAL.stoneDark);
}

function drawCheckpoint(camX) {
  const x = L.cpX * T + 12 - camX, gy = 15 * T;
  if (x < -40 || x > W + 40) return;
  ctx.fillStyle = '#4b2e3d'; ctx.fillRect(x - 2, gy - 84, 4, 84);
  ctx.fillRect(x - 2, gy - 84, 16, 3);
  const lx = x + 12, ly = gy - 70;
  if (G.checkpoint) {
    const gr = ctx.createRadialGradient(lx, ly + 8, 2, lx, ly + 8, 30);
    gr.addColorStop(0, 'rgba(255,214,120,0.7)'); gr.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = gr; ctx.fillRect(lx - 30, ly - 22, 60, 60);
  }
  ctx.fillStyle = '#4b2e3d'; rr(lx - 7, ly - 2, 14, 4, 2); ctx.fill();
  ctx.fillStyle = G.checkpoint ? '#ffd36e' : 'rgba(190,200,220,0.6)'; rr(lx - 6, ly + 2, 12, 15, 4); ctx.fill();
  ctx.strokeStyle = '#4b2e3d'; ctx.lineWidth = 2; ctx.stroke();
}

function drawPlat(p, camX) { // 浮き岩
  const x = p.x - camX, w = p.w * T;
  ctx.fillStyle = PAL.stoneDark;
  ctx.beginPath(); ctx.moveTo(x + 2, p.y + 8); ctx.lineTo(x + w * 0.3, p.y + 26); ctx.lineTo(x + w * 0.55, p.y + 34); ctx.lineTo(x + w * 0.8, p.y + 22); ctx.lineTo(x + w - 2, p.y + 8); ctx.fill();
  ctx.fillStyle = PAL.stone; rr(x, p.y, w, 13, 6); ctx.fill();
  ctx.fillStyle = PAL.stoneLight; ctx.fillRect(x + 6, p.y + 2, w - 12, 3);
  const gl = 0.5 + 0.5 * Math.sin(G.frame * 0.15 + p.ox);
  ctx.fillStyle = `rgba(140,240,255,${0.3 + gl * 0.3})`; ctx.beginPath(); ctx.arc(x + w * 0.55, p.y + 22, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c8fbff'; ctx.beginPath(); ctx.arc(x + w * 0.55, p.y + 22, 3, 0, Math.PI * 2); ctx.fill();
}

// ---------- 描画: HUD / 画面 ----------
function text(str, x, y, size, color = '#fff', align = 'left', stroke = '#2a1640') {
  ctx.font = `900 ${size}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = stroke;
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function hudPill(x, y, w, h) {
  ctx.fillStyle = 'rgba(30,18,58,0.45)'; rr(x, y, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,170,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
}
function drawHUD() {
  const pad = 16;
  hudPill(pad, 10, 300, 44);
  drawHero(pad + 26, 52, { scale: 0.42, face: 1, walk: 0 });
  text('× ' + G.lives, pad + 48, 32, 20);
  drawDrop(pad + 118, 32, 0.85);
  text('× ' + String(G.drops).padStart(2, '0'), pad + 134, 32, 20);
  text(String(G.score).padStart(7, '0'), pad + 288, 32, 20, '#ffe6a8', 'right');
  // 右上: 夜明けまでの時間 (太陽が地平線に向かって動く)
  const rw = 190, rx = W - pad - rw;
  hudPill(rx, 10, rw, 44);
  text('あさやけ高原', rx + 20, 32, 13, '#ffd2a1');
  const tm = Math.max(0, G.time);
  text(String(tm), rx + rw - 18, 32, 20, tm <= 100 && G.frame % 30 < 15 ? '#ff8a8a' : '#fff', 'right');
  drawSunIcon(rx + rw - 72, 32, 5, '#ffc61a');
  if (muted) text('♪ OFF', rx - 14, 32, 13, '#d8cce8', 'right');
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(28,16,56,0.74)';
  rr(x, y, w, h, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,120,0.85)'; ctx.lineWidth = 2.5; ctx.stroke();
}

function drawWorld() {
  const camX = Math.round(L.camX);
  drawBG(camX);
  drawGoal(camX);
  for (const it of L.items) if (it.kind === 'sun' && it.rise > 0) drawItem(it, camX); // つぼの後ろから出現
  const tx0 = Math.max(0, Math.floor(camX / T)), tx1 = Math.min(L.LW - 1, tx0 + Math.ceil(W / T) + 1);
  for (const lp of L.loops) drawLoop(lp, camX);
  for (let i = Math.floor(camX / (CHUNK * T)); i <= Math.floor((camX + W) / (CHUNK * T)); i++) {
    if (i * CHUNK < L.LW) ctx.drawImage(chunkCanvas(i), i * CHUNK * T - camX, 0);
  }
  for (let ty = 0; ty < L.LH; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const c = L.grid[ty][tx];
    if (c === ' ' || STATIC(c)) continue;
    const b = L.bumps.get(tx + ',' + ty);
    const off = b ? -Math.sin((10 - b) / 10 * Math.PI) * 9 : 0;
    drawTile(c, tx * T - camX, ty * T + off, tx, ty);
  }
  drawCheckpoint(camX);
  for (const p of L.plats) drawPlat(p, camX);
  for (const it of L.items) if (!(it.kind === 'sun' && it.rise > 0)) drawItem(it, camX);
  for (const e of L.enemies) if (e.active || e.x < camX + W) drawEnemy(e, camX);
  if (P && !P.hidden && G.mode !== 'title') {
    const blink = G.mode === 'play' && ((P.star > 0 && P.star < 120) || P.hurt > 0) && G.frame % 6 < 3;
    if (!blink) {
      const fx = P.loop ? P.feetX : P.x + P.w / 2, fy = P.loop ? P.feetY : P.y + P.h;
      const o = {
        face: P.face, walk: P.walk, air: !P.onGround && !P.dead && !P.loop, rot: P.dead ? 0 : P.rot,
        happy: P.star > 0 || (G.mode === 'goal' && L.goalPhase >= 1) || G.mode === 'clear',
        glow: P.star > 0 || (G.mode === 'goal' && L.goalPhase >= 2), dead: P.dead,
      };
      // 速いときは残像
      const sp = P.loop ? P.loop.speed : Math.abs(P.vx);
      if (sp > 7 && G.mode === 'play' && !P.dead) {
        const vx = P.loop ? Math.cos(P.loop.th) * sp : P.vx, vy = P.loop ? -Math.sin(P.loop.th) * sp : P.vy;
        for (const k of [3, 1.6]) {
          ctx.globalAlpha = 0.18 / k * 1.6;
          drawHero(fx - camX - vx * k, fy - vy * k, o);
        }
        ctx.globalAlpha = 1;
      }
      drawHero(fx - camX, fy, o);
    }
  }
  for (const p of L.parts) {
    const x = p.x - camX;
    if (p.kind === 'puff') {
      ctx.globalAlpha = p.t / 32; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    } else if (p.kind === 'spark') {
      ctx.globalAlpha = p.t / 30 > 1 ? 1 : p.t / 30; drawSunIcon(x, p.y, 2, '#fff3a0'); ctx.globalAlpha = 1;
    } else if (p.kind === 'petal') {
      ctx.save(); ctx.translate(x, p.y); ctx.rotate(G.frame * 0.05 + p.vx * 3);
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  }
  for (const s of L.pops) {
    ctx.globalAlpha = Math.min(1, s.t / 20);
    text(s.text, s.x - camX, s.y, 15, s.color || '#fff');
    ctx.globalAlpha = 1;
  }
}

function render() {
  if (!L) loadLevel();
  drawWorld();
  const cx = W / 2;
  const startMsg = IS_TOUCH ? 'タップでスタート' : 'Enter / スペース でスタート';
  const backMsg = IS_TOUCH ? 'タップでタイトルへ' : 'Enter でタイトルへ';
  if (G.mode === 'title') {
    panel(cx - 320, 60, 640, 420);
    text('てるしのくんRUN', cx, 120, 54, '#ffc61a', 'center');
    text('〜 夜明けをとりもどせ！ 〜', cx, 172, 20, '#ffe6d0', 'center');
    const bob = Math.sin(G.frame * 0.08) * 4;
    drawHero(cx, 345 + bob, { scale: 1.6, face: 1, walk: 0 });
    drawHero(cx - 180, 345, { scale: 1, face: 1, walk: G.frame * 0.2 });
    ctx.save(); ctx.translate(cx + 180, 345); ctx.scale(1.4, 1.4); drawEnemy({ x: -14, y: -26, w: 28, h: 26, type: 'gloom', vx: -1, anim: 0 }, 0); ctx.restore();
    if (G.frame % 60 < 42) text(startMsg, cx, 392, 22, '#fff', 'center');
    if (!IS_TOUCH) text('←→ 移動　Space/Z/↑ ジャンプ　Shift/X ダッシュ　P ポーズ　M 音', cx, 430, 15, '#e3d4ff', 'center');
    else text('◀▶ 移動　A ジャンプ　B ダッシュ', cx, 430, 15, '#e3d4ff', 'center');
    text('坂を駆け下りて加速！ ループを抜けて日の出の祭壇をめざそう', cx, 456, 15, '#e3d4ff', 'center');
  } else {
    drawHUD();
  }
  if (G.mode === 'play' && G.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 0, W, H);
    text('ひとやすみ中', cx, H / 2, 44, '#fff', 'center');
  }
  if (G.mode === 'gameover') {
    ctx.fillStyle = 'rgba(14,8,30,0.7)'; ctx.fillRect(0, 0, W, H);
    text('日がしずんでしまった…', cx, H / 2 - 60, 40, '#ffb3a0', 'center');
    text('GAME OVER', cx, H / 2 - 14, 22, '#e3d4ff', 'center');
    drawHero(cx, H / 2 + 110, { scale: 1.2, face: 1, walk: 0 });
    if (G.wait <= 0 && G.frame % 60 < 42) text(backMsg, cx, H / 2 + 150, 20, '#fff', 'center');
  }
  if (G.mode === 'clear') {
    panel(cx - 260, 100, 520, 340);
    text('夜明けだ！', cx, 152, 48, '#ffc61a', 'center');
    drawHero(cx, 330 - Math.abs(Math.sin(G.frame * 0.1)) * 14, { scale: 1.6, face: 1, walk: 0, happy: true, glow: true });
    text('笑顔がもどった！', cx, 362, 22, '#fff', 'center');
    text('スコア  ' + G.score, cx, 398, 22, '#ffe6a8', 'center');
    if (G.wait <= 0 && G.frame % 60 < 42) text(backMsg, cx, 470, 18, '#fff', 'center');
  }
}

// ---------- メインループ (60fps 固定ステップ) ----------
let last = performance.now(), accT = 0;
function loop(now) {
  accT += Math.min(100, now - last); last = now;
  while (accT >= 1000 / 60) { update(); accT -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
loadLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
