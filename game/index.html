<style>
  :root { --ctrl-top: auto; }
  html, body {
    margin: 0; height: 100%; background: #0b0820; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #060818; }
  #touch {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
    padding: 0 max(12px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    justify-content: space-between; align-items: flex-end;
  }
  #touch .pad { display: flex; gap: min(12px, 3vh); pointer-events: auto; align-items: flex-end; }
  #touch button {
    width: min(70px, 17vh); height: min(70px, 17vh); border-radius: 50%; border: 2px solid rgba(255,240,220,.7);
    background: rgba(30,20,60,.22); color: #fff6e6; font-size: 24px; font-weight: bold;
    touch-action: none; -webkit-tap-highlight-color: transparent; padding: 0;
  }
  #touch button.on { background: rgba(255,190,90,.55); }
  #touch button[data-k="jump"] { width: min(84px, 21vh); height: min(84px, 21vh); margin-bottom: min(18px, 4vh); }
  #touch .logo { display: none; }
  #fs {
    display: none; position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    width: 40px; height: 40px; border-radius: 10px; border: 2px solid rgba(255,240,220,.6);
    background: rgba(30,20,60,.35); color: #fff6e6; font-size: 20px; padding: 0;
  }
  @media (pointer: coarse) {
    #touch { display: flex; }
    body.fs-ok:not(.portrait):not(.standalone) #fs { display: block; }

  body.portrait #wrap { align-items: flex-start; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
  body.portrait #touch {
    top: var(--ctrl-top); align-items: center; align-content: space-evenly; flex-wrap: wrap;
    background: linear-gradient(#1a1238, #0b0820 70%);
    border-top: 2px solid rgba(255,198,26,.35);
    padding-top: 12px; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  }
  body.portrait #touch .logo {
    display: block; width: 100%; text-align: center; color: rgba(255,214,140,.55);

  }
  body.portrait #touch button { width: 76px; height: 76px; font-size: 26px; }
  body.portrait #touch button[data-k="jump"] { width: 96px; height: 96px; margin-bottom: 0; transform: translateY(-28px); }
  body.portrait #touch .pad { gap: 14px; }
</style>

// ---------- ゲーム状態 ----------
const G = { mode: 'title', score: 0, drops: 0, lives: 3, cpi: -1, frame: 0, paused: false, wait: 0,
            clock: 0, final: 0, best: loadBest(), newRecord: false, readyT: 0, goT: 0,

setTimeout(() => { G.high = loadNum('terushino-run-high'); try { G.bestRank = localStorage.getItem('terushino-run-rank') || ''; } catch (e) { } });
// ---------- タイムアタック ----------
// ---------- 評価: タイムとスコアそれぞれにランク、2 つを合わせて総合ランク ----------
const RANKS = ['D', 'C', 'B', 'A', 'S'];
const RANK_COL = { S: '#ffd84a', A: '#ff8fb1', B: '#7fd8ff', C: '#a8e6a0', D: '#c9c0dd' };
const TIME_LIMITS = [38, 50, 70, 100];           // 秒: これ以下なら S / A / B / C
function timeRank(f) { const s = f / 60; const i = TIME_LIMITS.findIndex(l => s <= l); return i < 0 ? 0 : 4 - i; }
function scoreRank(sc) { const r = sc / L.maxScore; return r >= 0.66 ? 4 : r >= 0.5 ? 3 : r >= 0.36 ? 2 : r >= 0.2 ? 1 : 0; }
function finishRun() {
  const tr = timeRank(G.final), sr = scoreRank(G.score);
  const total = Math.floor((tr + sr) / 2);
  G.result = { tr: RANKS[tr], sr: RANKS[sr], total: RANKS[total] };
  G.newHigh = G.score > G.high;
  if (G.newHigh) { G.high = G.score; saveNum('terushino-run-high', G.high); }
  if (!G.bestRank || total > RANKS.indexOf(G.bestRank)) { G.bestRank = RANKS[total]; try { localStorage.setItem('terushino-run-rank', G.bestRank); } catch (e) { } }
  if (G.newRecord || G.newHigh) sfx.record();
}
function saveNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { } }
function loadNum(k) { try { const v = Number(localStorage.getItem(k)); return v > 0 ? v : 0; } catch (e) { return 0; } }
function loadBest() { try { const v = Number(localStorage.getItem('terushino-run-best')); return v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('terushino-run-best', String(v)); } catch (e) { } }
function fmtTime(f) {
  const cs = Math.floor(f * 100 / 60);
  return `${Math.floor(cs / 6000)}'${String(Math.floor(cs / 100) % 60).padStart(2, '0')}"${String(cs % 100).padStart(2, '0')}`;
}
let L, P;

function loadLevel() {
  const lv = buildLevel();
  L = {
    grid: lv.grid, LW: lv.LW, LH: lv.LH, goalX: lv.goalX, goalY: lv.goalY, cps: lv.cps, loops: lv.loops,
    enemies: lv.enemies.map(makeEnemy),
    plats: lv.plats.map(p => ({ ...p, ox: p.x, oy: p.y, t: 0, dx: 0, dy: 0 })),
    items: [], parts: [], pops: [], bumps: new Map(), springs: new Map(),
    camX: 0, look: 0, goalPhase: 0, goalT: 0, beam: 0, sunrise: 0, zone: -1, banner: null, prog: 0,

  // スコア評価の基準: ステージで取れる点のおおよその満点

  for (const row of L.grid) for (const c of row) { if (c === 'o') drops++; else if (c === 'Q') jars++; else if (c === 'M') suns++; else if (c === 'B') clouds++; }
  L.maxScore = drops * 110 + jars * 700 + suns * 1000 + clouds * 50 + L.enemies.length * 150 + L.loops.length * 2000 + 2000;   // ループは PERFECT + 連続 1 回分
}
const HERO_H = 78;                // 主人公の見た目の身長 (px)
function makePlayer(tx) {
  return { x: tx * T + 3, y: 15 * T - 64, w: 26, h: 64, vx: 0, vy: 0, face: 1, onGround: false, ang: 0,
           coyote: 0, jumpBuf: 0, walk: 0, star: 0, hurt: 0, dead: false, plat: null, combo: 0, lastBottom: 0,
           hidden: false, jumped: false, spring: false, loop: null, rot: 0, boost: 0 };
}
function makeEnemy(d) {
  const w = 28, h = 26;
  return { type: d.type, x: d.tx * T + 2, y: (d.ty + 1) * T - h, w, h, vx: d.type === 'thorn' ? -1.1 : -0.8, vy: 0,
           active: false, state: null, t: 0, anim: hash(d.tx) * 6, onGround: false, hitWall: 0, ang: 0 };
}
function newGame() {
  G.score = 0; G.drops = 0; G.lives = 3; G.cpi = -1;
  G.clock = 0; G.newRecord = false; G.dropTotal = 0;

}
function startLevel() {
  loadLevel();
  const sx = G.cpi >= 0 ? L.cps[G.cpi] : 8;   // スタート位置は左下のボタンに隠れない所

  L.camX = clamp(P.x - W * 0.4, 0, L.LW * T - W);

// ---------- ユーティリティ ----------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function tile(tx, ty) {
  if (tx < 0 || tx >= L.LW) return 'S';
  if (ty < 0 || ty >= L.LH) return ' ';
  return L.grid[ty][tx];
}
const solidAt = (tx, ty) => SOLID.has(tile(tx, ty));
function addScore(n, x, y) { G.score += n; if (x !== undefined) L.pops.push({ x, y, text: String(n), t: 50 }); }
function addDrop(quiet) {
  G.drops++; if (!quiet) sfx.drop();
  G.dropTotal = (G.dropTotal || 0) + 1;
  if (G.dropTotal % 100 === 0) oneUp();
}
function oneUp() { G.lives++; sfx.oneup(); L.pops.push({ x: P.x, y: P.y - 10, text: '1UP', t: 70, color: '#9dffb0' }); }
function puff(cx, cy, n = 7, color = '#fff', size = 1) {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    L.parts.push({ kind: 'puff', x: cx, y: cy, vx: Math.cos(a) * 1.6 * size, vy: (Math.sin(a) * 1.2 - 0.6) * size, r: (6 + hash(i + cx) * 4) * size, t: 32, c: color });
  }
}
function dust(x, y, dir = 0) {
  for (let i = 0; i < 4; i++) L.parts.push({ kind: 'puff', x: x + (i - 1.5) * 6, y: y - 3, vx: (dir || (i < 2 ? -1 : 1)) * (0.6 + i * 0.25), vy: -0.4 - hash(i + x) * 0.6, r: 3 + i, t: 22, c: '#e9c6a6' });
}

// 足もとの地面を探す: x の列で、足の少し上 (段差・坂の上り分) から下に向かって最初の面
const STEP = 16;
function surfaceAt(x, yTop, yBot) {
  const tx = Math.floor(x / T);
  for (let ty = Math.floor(yTop / T); ty <= Math.floor(yBot / T); ty++) {
    const c = tile(tx, ty);
    let y, ang = 0, slope = false;
    if (SOLID.has(c)) y = ty * T;
    else if (c in SLOPES) { y = ty * T + SLOPES[c][0](x - tx * T); ang = SLOPES[c][1]; slope = true; }
    else continue;
    if (y < yTop || y > yBot) return null;
    return { y, ang, slope };
  }
  return null;
}

// タイルとの当たり判定つき移動 (坂道・小さな段差を乗り越える)
function moveBody(b, onHitCeil) {
  const wasGround = b.onGround;
  b.hitWall = 0;
  b.x += b.vx;
  // 地面を走っているときは、速さのぶんだけ高い段差 (坂の上の角) も乗りこえる。1 マスの壁は今までどおり止まる
  const stepH = STEP + (wasGround ? Math.min(Math.abs(b.vx), 14) : 0);
  const top = Math.floor(b.y / T), bot = Math.floor((b.y + b.h - 1 - stepH) / T);
  // 上り坂の下の地面は「壁」ではない (速く走ると坂の途中の地面に頭からぶつかって止まっていた)
  const UP_R = c => c === '/' || c === 'a' || c === 'b', UP_L = c => c === '\\' || c === 'c' || c === 'd';
  const underRamp = (tx, ty, dir) => wasGround && tile(tx, ty) === '#' && (dir > 0 ? UP_R(tile(tx, ty - 1)) : UP_L(tile(tx, ty - 1)));
  if (b.vx > 0) {
    const tx = Math.floor((b.x + b.w - 1) / T);
    for (let ty = top; ty <= bot; ty++) if (solidAt(tx, ty) && !underRamp(tx, ty, 1)) { b.x = tx * T - b.w; b.vx = 0; b.hitWall = 1; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x / T);
    for (let ty = top; ty <= bot; ty++) if (solidAt(tx, ty) && !underRamp(tx, ty, -1)) { b.x = (tx + 1) * T; b.vx = 0; b.hitWall = -1; break; }
  }
  b.y += b.vy; b.onGround = false;
  if (b.vy >= 0) {
    const fy = b.y + b.h;
    const snap = wasGround ? 6 + Math.abs(b.vx) * 1.1 : 0;
    const up = STEP + (wasGround ? Math.abs(b.vx) * 1.1 : 0);   // 速いほど坂を高く登れる
    const xs = [b.x + 3, b.x + b.w / 2, b.x + b.w - 3];
    const center = surfaceAt(xs[1], fy - up, fy + snap + 1);
    let best = center && center.slope ? center : null;
    if (!best) for (const sx of xs) {
      const s = surfaceAt(sx, fy - up, fy + snap + 1);
      if (s && (!best || s.y < best.y)) best = s;
    }
    if (best && (best.y <= fy || wasGround)) {
      b.y = best.y - b.h; b.vy = 0; b.onGround = true; b.ang = best.ang;
    } else b.ang = 0;
  } else {
    b.ang = 0;
    const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - 1) / T);
    const ty = Math.floor(b.y / T);
    const hit = [];
    for (let tx = l; tx <= r; tx++) if (solidAt(tx, ty)) hit.push(tx);
    if (hit.length === 1 && onHitCeil) {
      const tx = hit[0];
      const ovL = b.x + b.w - tx * T, ovR = (tx + 1) * T - b.x;
      if (ovL <= 8 && !solidAt(tx - 1, ty)) { b.x = tx * T - b.w; return; }
      if (ovR <= 8 && !solidAt(tx + 1, ty)) { b.x = (tx + 1) * T; return; }
    }
    if (hit.length) {
      b.y = (ty + 1) * T; b.vy = 0;
      if (onHitCeil) {
        const cx = b.x + b.w / 2;
        hit.sort((a, c) => Math.abs(a * T + T / 2 - cx) - Math.abs(c * T + T / 2 - cx));
        onHitCeil(hit[0], ty);
      }
    }
  }
}

// 下からブロックを叩いた
function bumpTile(tx, ty) {
  const t = tile(tx, ty);
  const key = tx + ',' + ty;
  if (t === 'Q') {
    L.grid[ty][tx] = 'U'; L.bumps.set(key, 10);
    L.items.push({ kind: 'droppop', x: tx * T + 8, y: ty * T - 24, vy: -9, t: 28 });
    for (let i = 0; i < 5; i++) addDrop(i > 0);   // 音は 1 回だけ
    addScore(200, tx * T + 4, ty * T - 30);
  } else if (t === 'M') {
    L.grid[ty][tx] = 'U'; L.bumps.set(key, 10);
    L.items.push({ kind: 'sun', x: tx * T + 6, y: ty * T, w: 20, h: 20, vx: 0, vy: 0, rise: 22, onGround: false, hitWall: 0 });
    sfx.appear();
  } else if (t === 'B') {
    L.grid[ty][tx] = ' ';
    puff(tx * T + 16, ty * T + 16, 8, '#ffe6f3');
    addScore(50); sfx.puff();
  } else { sfx.bump(); }
  for (const e of L.enemies) {
    if (e.active && !e.state && e.x + e.w > tx * T && e.x < tx * T + T && Math.abs(e.y + e.h - ty * T) < 6) {
      flipKill(e); addScore(200, e.x, e.y);
    }
  }
  if (tile(tx, ty - 1) === 'o') {
    L.grid[ty - 1][tx] = ' ';
    L.items.push({ kind: 'droppop', x: tx * T + 8, y: (ty - 1) * T, vy: -9, t: 28 });
    addDrop(); addScore(100);
  }
}
function flipKill(e) { e.state = 'flip'; e.vy = -6; e.vx = (P.x < e.x ? 1.5 : -1.5); sfx.kick(); puff(e.x + e.w / 2, e.y + e.h / 2, 5, '#b8a6d9'); }

// ダメージ: しずくを持っていれば、まき散らして耐える。0 個ならミス
function hurtPlayer() {
  if (P.dead || P.hurt > 0 || P.star > 0) return;
  if (G.drops <= 0) { killPlayer(); return; }
  const n = Math.min(G.drops, 16);
  G.drops = 0;
  const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i / (n - 1 || 1) - 0.5) * Math.PI * 1.4;
    const s = 3 + (i % 3);
    L.items.push({ kind: 'lost', x: cx - 8, y: cy - 8, w: 16, h: 16, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, b: 6, t: 200, wait: 30, onGround: false, hitWall: 0 });
  }
  P.charging = false; P.dash = 0;
  P.hurt = 120; P.vy = -6; P.vx = -P.face * 3; P.onGround = false; P.loop = null; P.jumped = false; P.rot = 0;
  sfx.hurt();
}
function killPlayer() {
  if (P.dead) return;
  P.charging = false; P.dash = 0;
  P.dead = true; P.vy = -10; P.vx = 0; P.deadT = 0; P.star = 0; P.loop = null; P.rot = 0;
  G.mode = 'dying'; bgmStop(); sfx.die();
}

// ---------- 更新 ----------
function updatePlats() {
  for (const p of L.plats) {
    p.t += 1 / 60;
    const ox = p.x, oy = p.y;
    const s = Math.sin(p.t * p.speed + p.phase) * p.range;
    if (p.axis === 'x') p.x = p.ox + s; else p.y = p.oy + s;
    p.dx = p.x - ox; p.dy = p.y - oy;
  }
}

// ループ (ひかりの輪) の中を走る
// ループのごほうび: 一回転で 1000 点、勢いよく (速さ 10 以上) 入ると PERFECT で 2000 点。
// 続けて回る (3 秒以内) と 2 倍、3 倍…
function loopReward(l, entry) {
  const perfect = entry >= 10;
  L.loopChain = G.clock - (L.lastLoop ?? -9999) < 180 ? (L.loopChain || 1) + 1 : 1;
  L.lastLoop = G.clock;
  const pts = (perfect ? 2000 : 1000) * L.loopChain;
  addScore(pts);
  l.flash = 40;
  L.loopBanner = { title: perfect ? 'PERFECT LOOP!' : 'LOOP!', pts, chain: L.loopChain, perfect, t: 130 };
  sfx.loop(perfect, L.loopChain);
  for (let k = 0; k < 20; k++) {
    const a = k / 20 * Math.PI * 2;
    L.parts.push({ kind: 'spark', x: l.cx + Math.cos(a) * (l.r + 11), y: l.cy + Math.sin(a) * (l.r + 11), vx: Math.cos(a) * 2, vy: Math.sin(a) * 2, t: 34 });
  }
}
function updateLoop() {
  const p = P, lp = p.loop;
  lp.speed = Math.max(5.5, lp.speed - 0.3 * Math.sin(lp.th));
  lp.th += lp.speed / lp.L.r;
  const l = lp.L;
  l.lit = lp.th;                                  // 走ったところまで輪が光る
  if (lp.th >= Math.PI * 2) {
    p.loop = null; p.rot = 0;
    p.x = l.cx - p.w / 2 + 1; p.y = l.cy + l.r - p.h; p.vy = 0; p.onGround = true;
    // 一回転のごほうび: 加速して飛び出し、しばらく敵を倒せる (スーパーダッシュと同じ状態) + 得点
    p.vx = Math.min(14, lp.speed + 3); p.boost = 70; p.dash = Math.max(p.dash || 0, 60);
    loopReward(l, lp.entry);
    return;
  }
  const fx = l.cx + l.r * Math.sin(lp.th), fy = l.cy + l.r * Math.cos(lp.th);
  p.feetX = fx; p.feetY = fy; p.rot = -lp.th;
  const bx = fx - Math.sin(lp.th) * p.h / 2, by = fy - Math.cos(lp.th) * p.h / 2;
  p.x = bx - p.w / 2; p.y = by - p.h / 2;
  p.walk += Math.min(lp.speed * 0.1, WALK_MAX);
  collectDrops(p);
}

function collectDrops(p) {
  const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 1) / T);
  const tp = Math.floor(p.y / T), bt = Math.floor((p.y + p.h - 1) / T);
  for (let ty = tp; ty <= bt; ty++) for (let tx = l; tx <= r; tx++) {
    if (tile(tx, ty) === 'o') { L.grid[ty][tx] = ' '; addDrop(); G.score += 10; L.parts.push({ kind: 'ring', x: tx * T + 16, y: ty * T + 16, vx: 0, vy: 0, t: 16 }); }
  }
}

function updatePlayer() {
  const p = P;
  if (p.hurt > 0) p.hurt--;
  if (p.star > 0) {
    p.star--;
    if (G.frame % 3 === 0) L.parts.push({ kind: 'spark', x: p.x + Math.random() * p.w, y: p.y + Math.random() * p.h, vx: 0, vy: -0.6, t: 30 });
  }
  if (p.loop) { updateLoop(); return; }

  const max = 6;
  let dir = p.hurt > 95 ? 0 : (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  // B 長押しでためる (その場でプルプル) → はなすとスーパーダッシュ
  if (keys.run && p.onGround && !p.charging && p.hurt <= 95) { p.charging = true; p.charge = 0; }
  if (p.charging) {
    if (!p.onGround || pressed.jump) p.charging = false;
    else if (!keys.run) {
      p.charging = false;
      p.vx = p.face * (8 + 6 * p.charge);
      p.dash = Math.round(50 + 80 * p.charge);
      sfx.superdash(p.charge);
      dust(p.x + p.w / 2, p.y + p.h, -p.face); dust(p.x + p.w / 2 - p.face * 10, p.y + p.h, -p.face);
    } else {
      p.charge = Math.min(1, p.charge + 1 / 45);
      if (dir) p.face = dir;          // ためている間は向きだけ変えられる
      dir = 0;
      p.vx *= 0.8;
      if (G.frame % 2 === 0) {
        const a = Math.random() * Math.PI * 2, r = 34 + Math.random() * 16;
        const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
        L.parts.push({ kind: 'gather', x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: -Math.cos(a) * r / 14, vy: -Math.sin(a) * r / 14, t: 14 });
      }
    }
  }
  if (p.dash > 0) {
    p.dash--;
    if (Math.abs(p.vx) < 3) p.dash = 0;
    if (G.frame % 2 === 0) L.parts.push({ kind: 'spark', x: p.x + p.w / 2 - Math.sign(p.vx) * 12, y: p.y + 12 + Math.random() * 44, vx: -Math.sign(p.vx) * 1.5, vy: 0, t: 22 });
  }
  if (p.onGround) {
    if (dir) {
      if (dir * p.vx < 0) { p.vx += dir * 0.5; if (Math.abs(p.vx) > 3 && G.frame % 4 === 0) dust(p.x + p.w / 2, p.y + p.h, -dir); }
      else if (Math.abs(p.vx) < max) p.vx += dir * (Math.abs(p.vx) < 3 ? 0.22 : 0.12);
      p.face = dir;
    } else {
      p.vx -= Math.sign(p.vx) * Math.min(Math.abs(p.vx), 0.12);
    }
    p.vx += Math.sin(p.ang) * 0.3;                            // 坂道で加速・減速
    if (Math.abs(p.vx) > max && !(p.boost > 0) && !(p.dash > 0)) p.vx -= Math.sign(p.vx) * 0.04;
  } else if (dir) {
    if (Math.abs(p.vx) < max || dir * p.vx < 0) p.vx += dir * 0.14;
    p.face = dir;
  }
  p.vx = clamp(p.vx, -14, 14);
  if (p.boost > 0) p.boost--;

  // ジャンプ (先行入力 + コヨーテタイム)
  if (pressed.jump) p.jumpBuf = 8; else if (p.jumpBuf > 0) p.jumpBuf--;
  if (p.onGround) p.coyote = 6; else if (p.coyote > 0) p.coyote--;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -10.5;
    p.jumpBuf = 0; p.coyote = 0; p.onGround = false; p.plat = null; p.jumped = true; p.spring = false;
    sfx.jump();
  }
  p.vy += (keys.jump && p.vy < 0 && !p.spring) ? 0.36 : 0.72;
  if (p.vy > 12) p.vy = 12;

  if (p.plat) { p.x += p.plat.dx; p.y += p.plat.dy; }
  const prevBottom = p.y + p.h, prevCx = p.x + p.w / 2, wasGround = p.onGround, fallV = p.vy;
  p.lastBottom = prevBottom;
  moveBody(p, bumpTile);
  p.plat = null;
  for (const pl of L.plats) {
    if (p.vy >= 0 && prevBottom <= pl.y + 2 && p.y + p.h >= pl.y && p.x + p.w > pl.x && p.x < pl.x + pl.w * T) {
      p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.plat = pl; p.ang = 0;
    }
  }
  if (p.onGround) {
    if (!wasGround && fallV > 6) dust(p.x + p.w / 2, p.y + p.h);
    p.combo = 0; p.jumped = false; p.spring = false;
  }
  p.walk += p.onGround ? Math.min(Math.abs(p.vx) * 0.1, WALK_MAX) : 0;
  if (p.onGround && !p.vx) p.walk = 0;
  p.rot = p.onGround ? p.ang * 0.6 : 0;

  // ループの入口: 地面を右向きに十分な速さで走っていたら一回転
  if (p.onGround && p.vx >= 6.5) {
    const cx = p.x + p.w / 2;
    for (const l of L.loops) {
      if (prevCx < l.cx && cx >= l.cx && Math.abs(p.y + p.h - (l.cy + l.r)) < 6) {
        p.loop = { L: l, th: 0, speed: p.vx, entry: p.vx }; p.jumped = false; sfx.whoosh();
        updateLoop(); return;
      }
    }
  }

  // しずく・いばら・はねる花・かぜの床
  collectDrops(p);
  const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 1) / T);
  const tp = Math.floor(p.y / T), bt = Math.floor((p.y + p.h - 1) / T);
  for (let ty = tp; ty <= bt; ty++) for (let tx = l; tx <= r; tx++) {
    const c = tile(tx, ty);
    if (c === '^') {
      if (!(p.dash > 0) && overlap(p, { x: tx * T + 3, y: ty * T + 14, w: 26, h: 18 })) hurtPlayer();
    } else if ((c === 'J' || c === 'K') && p.vy >= 0) {
      if (overlap({ x: p.x, y: p.y + p.h - 10, w: p.w, h: 10 }, { x: tx * T + 3, y: ty * T + 12, w: 26, h: 20 })) {
        p.vy = c === 'K' ? -19 : -14; p.onGround = false; p.spring = true; p.jumped = false;
        L.springs.set(tx + ',' + ty, 14); sfx.spring();
      }
    } else if (c === '>' && p.onGround) {
      if (p.vx < 11) { sfx.dash(); dust(p.x, p.y + p.h, -1); }
      p.vx = Math.max(p.vx, 11); p.face = 1; p.boost = 40;
    }
  }
  if (G.mode !== 'play') return;
  // 中間地点のランタン
  for (let i = G.cpi + 1; i < L.cps.length; i++) {
    if (p.x > L.cps[i] * T) {
      G.cpi = i; sfx.check();
      L.cpBanner = { n: i + 1, total: L.cps.length, t: 170 };
      for (let k = 0; k < 14; k++) {   // ランタンから光がはじける
        const a = k / 14 * Math.PI * 2;
        L.parts.push({ kind: 'spark', x: L.cps[i] * T + 24, y: 15 * T - 62, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5 - 1, t: 36 });
      }
    }
  }
  // ゾーン看板
  const zi = lastIndexWhere(ZONES, z => p.x >= z.x * T);
  if (zi > L.zone) { L.zone = zi; L.banner = { ...ZONES[zi], n: zi + 1, t: 200 }; if (zi > 0) sfx.zone(); }
  // 落下
  if (p.y > L.LH * T + 40) { killPlayer(); return; }
  // ゴール (日の出の祭壇)
  if (p.x + p.w / 2 >= L.goalX * T - 40) startGoal();
}

function updateEnemies(interact) {
  for (const e of L.enemies) {
    if (!e.active) { if (e.x < L.camX + W + 48) e.active = true; else continue; }
    if (e.state === 'squash') { e.t--; continue; }
    if (e.state === 'flip') { e.vy += 0.5; e.y += e.vy; e.x += e.vx; continue; }
    const vx0 = e.vx;
    e.vy = Math.min(e.vy + 0.5, 10);
    moveBody(e);
    if (e.hitWall) e.vx = -vx0;
    else if (e.type === 'thorn' && e.onGround) {
      const fx = vx0 > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!surfaceAt(fx, e.y + e.h - STEP, e.y + e.h + 18)) e.vx = -vx0;
    }
    if (e.vx === 0) e.vx = -vx0;
    e.anim += e.vx * 0.09;
    if (e.think > 0) e.think--;
    else if (e.type === 'gloom' && !e.spoke && e.x - L.camX < W - 60 && e.x - L.camX > 40) { e.spoke = true; e.think = 240; e.word = GLOOM_WORDS[Math.floor(Math.random() * GLOOM_WORDS.length)]; }
  }
  const alive = L.enemies.filter(e => e.active && !e.state);
  for (let i = 0; i < alive.length; i++) for (let j = i + 1; j < alive.length; j++) {
    const a = alive[i], b = alive[j];
    if (overlap(a, b)) {
      a.vx = (a.x < b.x ? -1 : 1) * Math.abs(a.vx);
      b.vx = (b.x < a.x ? -1 : 1) * Math.abs(b.vx);
    }
  }
  if (interact && !P.dead) {
    for (const e of alive) {
      if (e.state || !overlap(P, e)) continue;
      const attack = P.loop || P.star > 0 || P.dash > 0 || (e.type !== 'thorn' && ((P.jumped && !P.onGround) || (P.vy > 0 && P.lastBottom <= e.y + 12)));
      if (attack) {
        if (P.star > 0 || P.loop || P.dash > 0) { flipKill(e); addScore(200, e.x, e.y); continue; }
        e.state = 'squash'; e.t = 30;
        if (P.vy > 0) P.vy = keys.jump ? -10 : -7;
        const pts = [100, 200, 400, 800, 1000, 2000, 4000, 8000];
        if (P.combo >= pts.length) oneUp(); else addScore(pts[P.combo], e.x, e.y - 10);
        P.combo++;
        puff(e.x + e.w / 2, e.y + e.h / 2, 5, '#b8a6d9');
        sfx.stomp();
      } else { hurtPlayer(); if (P.dead) return; }
    }
  }
  L.enemies = L.enemies.filter(e => !(e.state === 'squash' && e.t <= 0) && e.y < L.LH * T + 100);
}

function updateItems() {
  for (const it of L.items) {
    if (it.kind === 'droppop') { it.vy += 0.6; it.y += it.vy; it.t--; if (it.t <= 0) it.dead = true; continue; }
    if (it.kind === 'lost') {
      it.vy = Math.min(it.vy + 0.3, 9);
      const vx0 = it.vx;
      moveBody(it);
      if (it.hitWall) it.vx = -vx0 * 0.6;
      if (it.onGround) { it.vy = -it.b; it.b *= 0.7; it.onGround = false; it.vx *= 0.9; }
      if (it.wait > 0) it.wait--;
      else if (G.mode === 'play' && !P.dead && overlap(P, it)) { it.dead = true; addDrop(); }
      if (--it.t <= 0 || it.y > L.LH * T + 50) it.dead = true;
      continue;
    }
    if (it.kind === 'sun') {
      if (it.rise > 0) { it.y -= 1; if (--it.rise === 0) it.vx = 1.8; }
      else {
        const vx0 = it.vx;
        it.vy = Math.min(it.vy + 0.4, 10);
        moveBody(it);
        if (it.hitWall) it.vx = -vx0;
        if (it.onGround) { it.vy = -6; it.onGround = false; }
      }
      if (G.mode === 'play' && !P.dead && overlap(P, it)) {
        it.dead = true; P.star = 600;
        addScore(1000, it.x, it.y); sfx.power();
      }
      if (it.y > L.LH * T + 50) it.dead = true;
    }
  }
  L.items = L.items.filter(i => !i.dead);
}

function updateParts() {
  for (const p of L.parts) {
    p.x += p.vx; p.y += p.vy; p.t--;
    if (p.kind === 'puff') { p.vx *= 0.92; p.vy *= 0.92; p.r += 0.35; }
  }
  L.parts = L.parts.filter(p => p.t > 0 && p.y < H + 40);
  for (const s of L.pops) { s.y -= 0.8; s.t--; }
  L.pops = L.pops.filter(s => s.t > 0);
  for (const m of [L.bumps, L.springs]) for (const [k, v] of m) { if (v <= 1) m.delete(k); else m.set(k, v - 1); }
  if (L.banner && --L.banner.t <= 0) L.banner = null;
  if (L.cpBanner && --L.cpBanner.t <= 0) L.cpBanner = null;
  if (L.loopBanner && --L.loopBanner.t <= 0) L.loopBanner = null;
  for (const l of L.loops) { if (l.flash > 0) l.flash--; if (!P || P.loop?.L !== l) { if (l.lit > 0 && !(l.flash > 0)) l.lit = Math.max(0, l.lit - 0.25); } }
  // 流れ星 (夜のあいだだけ)
  if (L.shoot) { L.shoot.t--; if (L.shoot.t <= 0) L.shoot = null; }
  else if (dawnLevel() < 0.45 && Math.random() < 0.006) L.shoot = { x: 200 + Math.random() * (W - 200), y: 20 + Math.random() * 120, t: 40 };
}

function progressOf(x) { return clamp(x / (L.goalX * T), 0, 1); }
function updateCamera() {
  const vx = P.loop ? P.loop.speed * 0.3 : P.vx;
  L.look += (clamp(vx * 22, -160, 220) - L.look) * 0.04;
  const target = P.x + P.w / 2 - W * 0.38 + L.look;
  L.camX += (target - L.camX) * 0.2;
  L.camX = clamp(L.camX, 0, L.LW * T - W);
  L.prog += (progressOf(P.x) - L.prog) * 0.05;
}

// ゴール: 祭壇の中央まで歩く → 光の柱 → 主人公が朝日のように昇る → 夜が明ける
function startGoal() {
  G.mode = 'goal'; L.goalPhase = 0; L.goalT = 0;
  P.star = 0; P.hurt = 0; P.boost = 0; P.charging = false; P.dash = 0;
  G.final = G.clock;
  if (!G.best || G.final < G.best) { G.best = G.final; G.newRecord = true; saveBest(G.final); }
  L.pops.push({ x: P.x - 40, y: P.y - 30, text: 'タイム ' + fmtTime(G.final), t: 150, color: '#bfe8ff' });
  bgmStop(); bell(84, 0, 0.06, 0.8); bell(91, 0.08, 0.05, 1);
}
function updateGoal() {
  const p = P;
  const cx = L.goalX * T + T / 2;
  if (L.goalPhase === 0) {
    const d = cx - (p.x + p.w / 2);
    p.face = d >= 0 ? 1 : -1;
    p.vx = Math.abs(d) < 60 ? clamp(d, -2.2, 2.2) : p.vx * 0.94 + Math.sign(d) * 0.1;
    p.vy = Math.min(p.vy + 0.72, 12);
    moveBody(p); p.walk += Math.min(Math.abs(p.vx) * 0.1, WALK_MAX); p.rot = 0;
    if (Math.abs(d) < 1.5 && p.onGround) { p.x = cx - p.w / 2; p.vx = 0; p.walk = 0; p.face = 1; L.goalPhase = 1; L.goalT = 50; }
  } else if (L.goalPhase === 1) {
    L.beam = 1 - L.goalT / 50;
    if (--L.goalT <= 0) { L.goalPhase = 2; L.goalT = 180; sfx.sunrise(); }
  } else if (L.goalPhase === 2) {
    p.y -= 0.5; p.onGround = true;
    L.sunrise = 1 - L.goalT / 180;
    if (G.frame % 2 === 0) L.parts.push({ kind: 'spark', x: cx - 40 + Math.random() * 80, y: p.y + Math.random() * 80, vx: 0, vy: -1, t: 40 });
    if (--L.goalT <= 0) {
      L.goalPhase = 3; L.goalT = 30;
      L.pops.push({ x: cx - 50, y: p.y - 20, text: '夜明けだ！', t: 120, color: '#fff3b0' });
    }
  } else if (L.goalPhase === 3) {
    if (L.goalT > 0) L.goalT--;
    else if (G.drops > 0) {
      const n = Math.min(G.drops, 2); G.drops -= n; G.score += 100 * n;
      if (G.frame % 3 === 0) sfx.tick();
    } else { L.goalPhase = 4; L.goalT = 50; }
  } else if (L.goalPhase === 4) {
    if (--L.goalT <= 0) { G.mode = 'clear'; G.wait = 40; G.clearT = 0; finishRun(); }
  }
}

function update() {
  G.frame++;
  if (pressed.mute) setMuted(!muted);
  warmChunks();
  switch (G.mode) {
    case 'title':
      if (!L) loadLevel();
      L.camX = (Math.sin(G.frame / 600) * 0.5 + 0.5) * 1400;
      L.prog = 1; L.sunrise = 1;   // タイトルは日の出後の明るい朝の空
      updatePlats(); updateParts();
      if (G.uiAct === 'start' || pressed.tap || pressed.start || pressed.jump) { initAudio(); G.mode = 'select'; G.sel = 0; sfx.ready(); }   // えらぶ画面はいつも てるしのくん から
      break;
    case 'select':   // キャラえらび
      if (!L) loadLevel();
      L.camX = (Math.sin(G.frame / 600) * 0.5 + 0.5) * 1400;
      L.prog = 1; L.sunrise = 1;
      updatePlats(); updateParts();
      if (pressed.left || pressed.right) { G.sel = (G.sel + (pressed.right ? 1 : CHAR_KEYS.length - 1)) % CHAR_KEYS.length; sfx.tick(); }
      if (G.uiAct && G.uiAct.startsWith('pick')) { const i = +G.uiAct.slice(4); if (i === G.sel) G.uiAct = 'go'; else { G.sel = i; sfx.tick(); } }
      if (pressed.pause) { G.mode = 'title'; break; }
      if (G.uiAct === 'go' || pressed.start || pressed.jump) {
        G.char = CHAR_KEYS[G.sel];
        newGame();
      }
      break;
    case 'ready':
      updatePlats(); updateParts(); updateCamera();
      if (G.readyT % 30 === 0 && G.readyT <= 90) sfx.ready();
      if (--G.readyT <= 0) { G.mode = 'play'; G.goT = 45; sfx.go(); }
      break;
    case 'play':
      if (G.paused) {
        if (pressed.left || pressed.right) { G.psel = G.psel ? 0 : 1; sfx.tick(); }
        if (G.uiAct === 'resume' || pressed.pause || ((pressed.start || pressed.jump) && !G.psel)) G.paused = false;
        else if (G.uiAct === 'exit' || ((pressed.start || pressed.jump) && G.psel)) { G.paused = false; bgmStop(); G.mode = 'title'; loadLevel(); }
        break;
      }
      if (pressed.pause || G.uiAct === 'pause') { G.paused = true; G.psel = 0; for (const k in keys) keys[k] = false; sfx.ready(); break; }
      G.clock++;
      if (G.goT > 0) G.goT--;
      updatePlats();
      updatePlayer();
      if (G.mode === 'play') updateEnemies(true);
      updateItems(); updateParts(); updateCamera();
      break;
    case 'dying':
      P.deadT++; G.clock++;
      if (P.deadT > 30) { P.vy += 0.5; P.y += P.vy; }
      updateParts();
      if (P.deadT > 150) {
        G.lives--;
        if (G.lives <= 0) { G.mode = 'gameover'; G.wait = 60; }
        else startLevel();
      }
      break;
    case 'goal':
      updatePlats(); updateGoal(); updateEnemies(false); updateItems(); updateParts(); updateCamera();
      break;
    case 'gameover':
    case 'clear':
      updatePlats(); updateParts();
      if (G.mode === 'clear' && G.frame % 14 === 0) {
        L.parts.push({ kind: 'petal', x: L.camX + Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 1.2, vy: 1.2 + Math.random() * 1.5,
          t: 420, c: ['#ffb36b', '#ffd23f', '#ff8fb1', '#fff3b0'][Math.floor(Math.random() * 4)] });
      }
      if (G.wait > 0) G.wait--;
      else if (pressed.start || pressed.jump || pressed.tap) { G.mode = 'title'; loadLevel(); }
      break;
  }
  bgmTick();
  if (G.mode === 'play' && !G.paused && P && P.charging) { chargeStart(); chargeUpdate(P.charge); } else if (chargeVoice) chargeStop();
  for (const k in pressed) delete pressed[k];
  G.uiAct = null;
}

// ============================================================
//  描画
// ============================================================
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mixRgb(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return A.map((v, i) => Math.round(lerp(v, B[i], t))); }
function mix(a, b, t) { return `rgb(${mixRgb(a, b, t).join(',')})`; }
function mixA(a, b, t, al) { return `rgba(${mixRgb(a, b, t).join(',')},${al})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// 時刻の進み具合 0 (真夜中) 〜 1 (日の出)
function dawnLevel() {
  if (!L) return 0;
  return lerp(L.prog * 0.9, 1, L.sunrise || 0);
}
// 時刻ごとの空の色 (上・中・地平線)
const SKY_KEYS = [
  [0.00, '#03041a', '#0a103a', '#161f4e'],
  [0.30, '#060a2c', '#16245e', '#2e3a78'],
  [0.55, '#13205f', '#3c4c98', '#8a66a8'],
  [0.78, '#2f4ca0', '#a86c9e', '#ff9468'],
  [1.00, '#56a2ec', '#ffc99a', '#fff0c8'],
];
function keyed(keys, p, idx) {
  let i = 0; while (i < keys.length - 2 && p > keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1];
  return mixRgb(a[idx], b[idx], smooth(a[0], b[0], p));
}
const rgb = c => `rgb(${c.join(',')})`;
const rgba = (c, a) => `rgba(${c.join(',')},${a})`;

// ---------- 主人公 (元イラストを切り分けたパーツ) ----------
const HERO_IMG = {};
for (const k in HERO_SRC) { const im = new Image(); im.src = HERO_SRC[k]; HERO_IMG[k] = im; }
const CROC_STILL_IMG = {};
for (const k in CROC_STILL_SRC) { const im = new Image(); im.src = CROC_STILL_SRC[k]; CROC_STILL_IMG[k] = im; }
const CROC_IMG = {};
for (const k in CROC_SRC) { const im = new Image(); im.src = CROC_SRC[k]; CROC_IMG[k] = im; }
// えらべるキャラ
const CHARS = {
  sun: { name: 'てるしのくん', M: HERO_META, IMG: HERO_IMG },
  croc: { name: 'ワニ', M: CROC_META, IMG: CROC_IMG, still: { M: CROC_STILL_META, IMG: CROC_STILL_IMG } },
};
const CHAR_KEYS = Object.keys(CHARS);
G.char = 'sun';
const heroReady = IMG => Object.values(IMG).every(i => i.complete && i.naturalWidth > 0);
// 走りの手足: 振りの速さに上限 (1 秒に約 4 歩)。速く走っても手足がはっきり動いて見えるように
const WALK_MAX = 0.42;
function drawHero(x, y, o) {
  const C0 = CHARS[o.who || G.char] || CHARS.sun, C = (o.still && C0.still) || C0, META = C.M, IMG = C.IMG;   // still: えらぶ画面用の切れ目のない絵
  if (!heroReady(IMG)) return;
  const k = (o.scale || 1) * HERO_H / META.height;
  const px = META.height / HERO_H;
  const M = META.parts, PV = META.pivots;
  const sw = o.air ? 0 : Math.sin(o.walk || 0);
  const bob = o.air ? 0 : -Math.abs(sw) * 2.6 * px;
  ctx.save();
  ctx.translate(x, y);
  const rot = (o.rot || 0) + (META.waddle && !o.air ? sw * META.waddle : 0);   // ワニはよちよち体をゆらす
  if (rot) ctx.rotate(rot);
  ctx.scale(k * (o.face || 1) * (META.flip ? -1 : 1), k);   // 左向きの絵は反転
  if (META.flip) {
    // ワニ: パーツごとの光は重なりに筋が出るので、うしろに丸い光を置く
    if (o.glow) {
      const g = ctx.createRadialGradient(0, -META.height * 0.5, 10, 0, -META.height * 0.5, META.height * 0.75);
      g.addColorStop(0, 'rgba(255,220,90,0.75)'); g.addColorStop(1, 'rgba(255,200,60,0)');
      ctx.fillStyle = g; ctx.fillRect(-META.height, -META.height * 1.3, META.height * 2, META.height * 1.6);
      ctx.filter = `brightness(${1.15 + Math.sin(G.frame * 0.4) * 0.08})`;
    }
  } else if (o.glow) {
    ctx.shadowColor = 'rgba(255,200,40,0.95)'; ctx.shadowBlur = 20;
    ctx.filter = `brightness(${1.1 + Math.sin(G.frame * 0.4) * 0.07})`;
  } else { ctx.shadowColor = 'rgba(255,170,40,0.55)'; ctx.shadowBlur = 10; }
  const part = (n, dx = 0, dy = 0) => ctx.drawImage(IMG[n], M[n][0] + dx, M[n][1] + dy);
  if (IMG.tail) {   // しっぽ (付け根を軸にふりふり)
    const [tx, ty] = PV.tail, a = (o.air ? -0.25 : sw * 0.18) + Math.sin(G.frame * 0.15) * 0.06;
    ctx.save(); ctx.translate(tx, ty + bob); ctx.rotate(a); ctx.drawImage(IMG.tail, M.tail[0] - tx, M.tail[1] - ty); ctx.restore();
  }
  if (IMG.under) part('under', 0, bob);   // 体の下じき (腕のつけ根の隙間をかくす)
  const arms = () => {
    if (!IMG.armL) return;
    for (const [n, s] of [['armL', 1], ['armR', -1]]) {
      const a = o.air ? 0.38 : sw * (META.armSwing || 0.32) * s;
      const [pvx, pvy] = PV[n];
      ctx.save(); ctx.translate(pvx, pvy + bob); ctx.rotate(a * s);
      ctx.drawImage(IMG[n], M[n][0] - pvx, M[n][1] - pvy);
      ctx.restore();
    }
  };
  if (!META.armsFront) arms();   // てるしのくんは腕を体のうしろに
  for (const [n, i] of [['legL', -1], ['legR', 1]]) {
    const lift = o.air ? (i < 0 ? 4 : 0.5) : Math.max(0, sw * i) * (META.legLift ?? 6);
    part(n, (o.air ? 0 : sw * i * (META.legShift ?? 2)) * px, -lift * px + (META.legLift === 0 ? bob : 0));   // ワニは体ごとぴょこぴょこ
  }
  part('torso', 0, bob);
  if (META.armsFront) arms();    // ワニは腕を体の手前に (肩の線が欠けないように)
  ctx.drawImage(IMG[o.dead ? 'headDead' : o.happy ? 'headHappy' : 'head'], M.head[0], M.head[1] + bob);
  ctx.restore();
}

// どんよりぐものふきだし (夜の暗さより手前に描いて読みやすく)

function drawItem(it, camX) {

    g.addColorStop(0, '#fffbe0'); g.addColorStop(1, '#ffc93c');

// ---------- タイル (動くもの・変化するもの) ----------
const PAL = {
  cloud: '#ffe9f4', cloudShade: '#d9a6c8', glassFrame: '#3b6b7a', glassFrameUsed: '#4a4d63',
  stone: '#dba57c', stoneDark: '#a8704f', stoneLight: '#f3c9a2', bramble: '#4b2350', thorn: '#ff86b8',
};
function drawTile(c, x, y, tx, ty) {
  switch (c) {
    case '>': { // かぜの床
      const g = ctx.createLinearGradient(0, y + 22, 0, y + 32);
      g.addColorStop(0, '#4c8fa3'); g.addColorStop(1, '#1f3e52');
      ctx.fillStyle = g; rr(x, y + 23, T, 9, 3); ctx.fill();
      const ph = (G.frame * 0.25) % 1;
      for (let i = 0; i < 2; i++) {
        const ax = x + 4 + ((i * 16 + ph * 16) % T);
        ctx.fillStyle = `rgba(150,245,255,${0.55 + 0.45 * Math.sin(G.frame * 0.3 + i)})`;
        ctx.beginPath(); ctx.moveTo(ax, y + 24); ctx.lineTo(ax + 7, y + 27.5); ctx.lineTo(ax, y + 31); ctx.lineTo(ax + 3, y + 27.5); ctx.fill();
      }
      break;
    }
    case 'J': case 'K': { // はねる花
      const s = L.springs.get(tx + ',' + ty) || 0;
      const squash = s > 8 ? (14 - s) / 6 : s / 8;
      const h = 12 + (1 - squash) * 2 - (s > 8 ? 6 : -6) * squash;
      ctx.strokeStyle = '#2f6e46'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + 16, y + T); ctx.quadraticCurveTo(x + 10, y + T - h / 2, x + 16, y + T - h); ctx.stroke();
      ctx.strokeStyle = '#5fbf6a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#4fa85c';
      ctx.beginPath(); ctx.ellipse(x + 8, y + T - 4, 7, 3, -0.4, 0, Math.PI * 2); ctx.ellipse(x + 24, y + T - 4, 7, 3, 0.4, 0, Math.PI * 2); ctx.fill();
      const col = c === 'K' ? ['#ff5f86', '#ffd0dc', '#a8264a'] : ['#ffb84d', '#ffe6b0', '#a8641a'];
      const py = y + T - h - 9;
      const g = ctx.createLinearGradient(0, py, 0, py + 11);
      g.addColorStop(0, col[1]); g.addColorStop(0.4, col[0]); g.addColorStop(1, col[2]);
      ctx.fillStyle = g; rr(x + 1, py, 30, 11, 5.5); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; rr(x + 6, py + 2, 12, 2.5, 1.2); ctx.fill();
      break;
    }
    case 'B': { // くもブロック
      const g = ctx.createLinearGradient(0, y, 0, y + T);
      g.addColorStop(0, '#fff7fb'); g.addColorStop(0.6, PAL.cloud); g.addColorStop(1, PAL.cloudShade);
      ctx.fillStyle = PAL.cloudShade; rr(x + 1, y + 3, T - 2, T - 3, 10); ctx.fill();
      ctx.fillStyle = g; rr(x + 1, y + 1, T - 2, T - 5, 10); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x + 9, y + 9, 5, 0, Math.PI * 2); ctx.arc(x + 17, y + 7, 6, 0, Math.PI * 2); ctx.arc(x + 24, y + 10, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(190,130,170,0.5)'; ctx.fillRect(x + 8, y + 21, 5, 2); ctx.fillRect(x + 19, y + 19, 6, 2);
      break;
    }
    case 'Q': case 'M': case 'U': { // ひかりのつぼ (ガラスのランタン)
      const used = c === 'U';
      ctx.fillStyle = used ? PAL.glassFrameUsed : PAL.glassFrame; rr(x + 1, y + 1, T - 2, T - 2, 8); ctx.fill();
      ctx.fillStyle = used ? 'rgba(170,170,200,0.25)' : 'rgba(180,240,250,0.35)'; rr(x + 4, y + 6, T - 8, T - 10, 6); ctx.fill();
      const lg = ctx.createLinearGradient(0, y, 0, y + 6);
      lg.addColorStop(0, used ? '#8a8ea8' : '#f0c070'); lg.addColorStop(1, used ? '#55596f' : '#a8682a');
      ctx.fillStyle = lg; ctx.fillRect(x + 7, y + 1, T - 14, 5);
      if (!used) {
        const p = 0.5 + 0.5 * Math.sin(G.frame * 0.1 + tx);
        const gr = ctx.createRadialGradient(x + 16, y + 18, 1, x + 16, y + 18, 10 + p * 2);
        gr.addColorStop(0, '#fffbe0'); gr.addColorStop(0.45, '#ffcf4a'); gr.addColorStop(1, 'rgba(255,170,40,0)');
        ctx.fillStyle = gr; ctx.fillRect(x + 4, y + 6, T - 8, T - 10);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x + 7, y + 9, 3, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x + 11, y + 9, 1.5, 6);
      break;
    }
    case 'S': { // 日時計石
      const g = ctx.createLinearGradient(x, y, x + T, y + T);
      g.addColorStop(0, PAL.stoneLight); g.addColorStop(0.5, PAL.stone); g.addColorStop(1, '#b97f5c');
      ctx.fillStyle = PAL.stoneDark; rr(x, y, T, T, 5); ctx.fill();
      ctx.fillStyle = g; rr(x + 1, y + 1, T - 3, T - 4, 5); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,220,0.7)'; ctx.fillRect(x + 4, y + 2, T - 10, 2);
      ctx.strokeStyle = PAL.stoneDark; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x + 15, y + 16, 5, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        ctx.beginPath(); ctx.moveTo(x + 15 + Math.cos(a) * 8, y + 16 + Math.sin(a) * 8); ctx.lineTo(x + 15 + Math.cos(a) * 11, y + 16 + Math.sin(a) * 11); ctx.stroke();
      }
      break;
    }
    case '^': { // いばら
      ctx.strokeStyle = '#2a1030'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y + 27);
      ctx.bezierCurveTo(x + 8, y + 16, x + 14, y + 32, x + 20, y + 22);
      ctx.bezierCurveTo(x + 24, y + 16, x + 30, y + 24, x + 32, y + 26); ctx.stroke();
      ctx.strokeStyle = '#6b3474'; ctx.lineWidth = 3; ctx.stroke();
      ctx.lineWidth = 2.5; ctx.strokeStyle = PAL.bramble;
      ctx.beginPath(); ctx.arc(x + 10, y + 18, 4, Math.PI, Math.PI * 2.4); ctx.stroke();
      for (const [sx, sy] of [[3, 24], [12, 21], [20, 20], [28, 23], [8, 15]]) {
        ctx.fillStyle = PAL.thorn;
        ctx.beginPath(); ctx.moveTo(x + sx - 3, y + sy + 2); ctx.lineTo(x + sx, y + sy - 8); ctx.lineTo(x + sx + 3, y + sy + 2); ctx.fill();
        ctx.fillStyle = '#ffd0e4'; ctx.beginPath(); ctx.moveTo(x + sx - 1, y + sy); ctx.lineTo(x + sx, y + sy - 6); ctx.lineTo(x + sx + 0.5, y + sy); ctx.fill();
      }
      break;
    }
    case 'o': drawDrop(x + 16, y + 16 + Math.sin(G.frame * 0.08 + tx * 0.7) * 2.5); break;
  }
}

// ---------- 地形: 1 ピクセルずつ質感をつけて、32 列ずつ画像にしておく ----------
const STATIC = c => c === '#' || c === 'S' || c in SLOPES;
const CHUNK = 32;
let chunks = [];
const STRATA = [[142, 76, 120], [162, 94, 134], [122, 63, 108], [150, 83, 128], [170, 104, 140]].map(c => c);
const CRUST_HI = [255, 228, 190], CRUST = [246, 196, 146], CRUST_LO = [214, 150, 104], CRUST_SH = [120, 62, 92];
function noise2(x, y) { let n = (x * 374761393 + y * 668265263) | 0; n = (n ^ (n >>> 13)) * 1274126177 | 0; return ((n ^ (n >>> 16)) & 255) / 255; }
function solidPx(wx, y) {
  const tx = Math.floor(wx / T), ty = Math.floor(y / T);
  const c = tile(tx, ty);
  if (c === '#') return true;
  if (c in SLOPES) return (y - ty * T) >= SLOPES[c][0](wx - tx * T);
  return false;
}
function chunkCanvas(i) {
  if (chunks[i]) return chunks[i];
  const CW = CHUNK * T, HH = L.LH * T;
  const c = document.createElement('canvas'); c.width = CW; c.height = HH;
  const cx2 = c.getContext('2d');
  const img = cx2.createImageData(CW, HH), d = img.data;
  for (let px = 0; px < CW; px++) {
    const wx = i * CW + px;
    if (wx >= L.LW * T) break;
    const wave = Math.sin(wx * 0.045) * 5 + Math.sin(wx * 0.013) * 7;
    let depth = 0;
    for (let y = 0; y < HH; y++) {
      if (!solidPx(wx, y)) { depth = 0; continue; }
      depth++;
      const n = noise2(wx, y);
      let col;
      if (depth <= 2) col = CRUST_HI;
      else if (depth <= 8) col = n > 0.85 ? CRUST_LO : CRUST;
      else if (depth <= 11) col = n > 0.5 ? CRUST_LO : CRUST;
      else if (depth <= 13) col = CRUST_SH;
      else {
        const band = Math.floor((y - wave + noise2(wx >> 2, y >> 3) * 3) / 10);
        col = STRATA[((band % 5) + 5) % 5];
      }
      // 表面から深くなるほど暗く、ざらつきを足す
      const shade = depth > 13 ? 1 - Math.min(0.42, (depth - 13) / 260) - (depth < 22 ? (22 - depth) * 0.012 : 0) : 1;
      const grain = (n - 0.5) * (depth > 13 ? 18 : 10);
      const o = (y * CW + px) * 4;
      d[o] = clamp(col[0] * shade + grain, 0, 255);
      d[o + 1] = clamp(col[1] * shade + grain, 0, 255);
      d[o + 2] = clamp(col[2] * shade + grain, 0, 255);
      d[o + 3] = 255;
    }
  }
  cx2.putImageData(img, 0, 0);
  // 崖の側面・浮き島の底に影、宝石・小石・夜光草の飾り
  const main = ctx; ctx = cx2;
  for (let ty = 0; ty < L.LH; ty++) for (let tx = i * CHUNK; tx < Math.min(L.LW, (i + 1) * CHUNK); tx++) {
    const ch = L.grid[ty][tx], x = (tx - i * CHUNK) * T, y = ty * T;
    if (ch === 'S') { drawTile('S', x, y, tx, ty); continue; }
    if (ch !== '#') continue;
    if (!GROUNDISH(tile(tx - 1, ty)) && tile(tx - 1, ty) !== 'S') { const g = ctx.createLinearGradient(x, 0, x + 8, 0); g.addColorStop(0, 'rgba(40,10,40,0.45)'); g.addColorStop(1, 'rgba(40,10,40,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, 8, T); }
    if (!GROUNDISH(tile(tx + 1, ty)) && tile(tx + 1, ty) !== 'S') { const g = ctx.createLinearGradient(x + T, 0, x + T - 8, 0); g.addColorStop(0, 'rgba(40,10,40,0.45)'); g.addColorStop(1, 'rgba(40,10,40,0)'); ctx.fillStyle = g; ctx.fillRect(x + T - 8, y, 8, T); }

      ctx.fillStyle = 'rgba(70,30,60,0.55)'; ctx.beginPath(); ctx.ellipse(sx + 1, sy + 1, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c99ab0'; ctx.beginPath(); ctx.ellipse(sx, sy, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();

// 地形画像は少しずつ前もって作っておく (走行中にカクつかないように)
function warmChunks() {
  if (!L) return;
  const n = Math.ceil(L.LW / CHUNK);
  const cur = Math.floor(L.camX / (CHUNK * T));
  for (let k = 0; k < n; k++) { const i = (cur + k) % n; if (!chunks[i]) { chunkCanvas(i); return; } }

// ---------- 背景 (時刻で変わる空と遠景) ----------
const STARS = Array.from({ length: 160 }, (_, i) => ({ x: hash(i * 3.1) * 1280, y: hash(i * 7.7) * 340, r: 0.5 + Math.pow(hash(i * 1.3), 3) * 2.2, c: ['#ffffff', '#cfe0ff', '#fff1c4', '#ffd6e8'][i % 4] }));
const MOTES = Array.from({ length: 34 }, (_, i) => ({ x: hash(i * 5.3) * 1400, y: 120 + hash(i * 2.9) * 360, s: 0.2 + hash(i * 4.1) * 0.5 }));
function drawBG(camX) {
  const p = dawnLevel();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(keyed(SKY_KEYS, p, 1)));
  g.addColorStop(0.5, rgb(keyed(SKY_KEYS, p, 2)));
  g.addColorStop(0.86, rgb(keyed(SKY_KEYS, p, 3)));
  g.addColorStop(1, rgb(keyed(SKY_KEYS, p, 3)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 星
  const sa = 1 - smooth(0.4, 0.78, p);
  if (sa > 0) {
    for (const s of STARS) {
      if (s.x > W) continue;
      const tw = 0.55 + 0.45 * Math.sin(G.frame * (0.03 + s.r * 0.02) + s.x);
      ctx.globalAlpha = sa * tw * (1 - s.y / 420);
      ctx.fillStyle = s.c;
      if (s.r > 1.6) { ctx.fillRect(s.x - s.r, s.y, s.r * 2 + 1, 1); ctx.fillRect(s.x, s.y - s.r, 1, s.r * 2 + 1); }
      ctx.fillRect(s.x - s.r / 2, s.y - s.r / 2, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    // 流れ星
    if (L.shoot) {
      const s = L.shoot, k = 1 - s.t / 40;
      const x = s.x + k * 180, y = s.y + k * 70;
      const lg = ctx.createLinearGradient(x - 70, y - 27, x, y);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(1, `rgba(255,255,255,${sa * (1 - k)})`);
      ctx.strokeStyle = lg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 70, y - 27); ctx.lineTo(x, y); ctx.stroke();
    }
  }
  // 月 (夜明けとともに沈む)
  const ma = 1 - smooth(0.55, 0.85, p);
  if (ma > 0) {
    const mx = W * 0.18 + p * 140, my = 80 + p * 330;
    const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 120);
    mg.addColorStop(0, `rgba(220,230,255,${0.35 * ma})`); mg.addColorStop(1, 'rgba(220,230,255,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - 120, my - 120, 240, 240);
    const dg = ctx.createRadialGradient(mx - 8, my - 8, 4, mx, my, 30);
    dg.addColorStop(0, '#fffdf2'); dg.addColorStop(1, '#d8d4c0');
    ctx.globalAlpha = ma; ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(mx, my, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(160,150,130,0.35)';
    for (const [cx, cy, r] of [[-8, -6, 6], [9, 4, 4], [-2, 11, 3.5], [10, -10, 2.5]]) { ctx.beginPath(); ctx.arc(mx + cx, my + cy, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  // 太陽 (後半になると地平線から顔を出す)
  const sunP = smooth(0.62, 1, p);
  const sunX = W * 0.74, sunY = 520 - sunP * 230;
  const hg = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 460);
  hg.addColorStop(0, `rgba(255,190,110,${0.15 + smooth(0.45, 1, p) * 0.6})`); hg.addColorStop(1, 'rgba(255,150,110,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
  if (sunP > 0) {
    const sg = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 46);
    sg.addColorStop(0, '#fffbe6'); sg.addColorStop(0.6, '#ffe08a'); sg.addColorStop(1, '#ffb05a');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sunX, sunY, 44, 0, Math.PI * 2); ctx.fill();
  }
  // 雲 (月明かり → 朝焼けに色づく)
  const cTop = keyed([[0, '#3a4280', '#262c5e'], [0.55, '#8a7ab8', '#4e4a8a'], [0.8, '#ffc2a0', '#c06c98'], [1, '#ffffff', '#ffd6b8']], p, 1);
  const cBot = keyed([[0, '#3a4280', '#262c5e'], [0.55, '#8a7ab8', '#4e4a8a'], [0.8, '#ffc2a0', '#c06c98'], [1, '#ffffff', '#ffd6b8']], p, 2);
  const cw = 2600;
  for (let i = 0; i < 9; i++) {
    const sx = ((hash(i * 9.1) * cw - camX * (0.06 + hash(i) * 0.06)) % cw + cw) % cw - 300;
    if (sx > W + 40) continue;
    const sy = 50 + hash(i * 4.4) * 200, w = 140 + hash(i * 2.2) * 200;
    const cg = ctx.createLinearGradient(0, sy - 20, 0, sy + 16);
    cg.addColorStop(0, rgba(cTop, 0.85)); cg.addColorStop(1, rgba(cBot, 0.8));
    ctx.fillStyle = cg;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) { const kx = sx + w * (k / 4), r = 10 + hash(i * 3 + k) * 14; ctx.ellipse(kx, sy - r * 0.4, r * 1.4, r, 0, 0, Math.PI * 2); }
    ctx.fill();
    ctx.fillStyle = rgba(cBot, 0.85); rr(sx - 14, sy, w + 28, 10, 5); ctx.fill();
  }
  // 遠い山脈
  const far = keyed([[0, '#121a44', '#0c1132'], [0.5, '#2a3470', '#1d2558'], [0.8, '#6a5a98', '#4a3f78'], [1, '#9cb4d8', '#7e94c0']], p, 1);
  const farB = keyed([[0, '#121a44', '#0c1132'], [0.5, '#2a3470', '#1d2558'], [0.8, '#6a5a98', '#4a3f78'], [1, '#9cb4d8', '#7e94c0']], p, 2);
  {
    const off = camX * 0.06, base = 380;
    const ridge = x => base - 70 - Math.abs(Math.sin((x + off) * 0.004)) * 90 - Math.abs(Math.sin((x + off) * 0.011 + 1)) * 40 - Math.sin((x + off) * 0.03) * 6;
    const fg = ctx.createLinearGradient(0, base - 200, 0, base + 60);
    fg.addColorStop(0, rgb(far)); fg.addColorStop(1, rgb(farB));
    ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 6) ctx.lineTo(x, ridge(x));
    ctx.lineTo(W, H); ctx.fill();
    // 山頂の雪/光
    ctx.strokeStyle = rgba(keyed([[0, '#5a6aa8', '#5a6aa8'], [1, '#fff2d8', '#fff2d8']], p, 1), 0.5); ctx.lineWidth = 1.5;
    ctx.beginPath(); for (let x = 0; x <= W; x += 6) ctx.lineTo(x, ridge(x) + 1); ctx.stroke();
  }
  // 台地 (メサ) — 朝日の側がふちどられる
  const mesa = (f, base, seg, seed, body, body2, rim) => {
    const off = camX * f;
    const i0 = Math.floor(off / seg) - 1, i1 = Math.floor((off + W) / seg) + 1;
    const mg = ctx.createLinearGradient(0, base - 160, 0, H);
    mg.addColorStop(0, body); mg.addColorStop(1, body2);
    ctx.fillStyle = mg; ctx.fillRect(0, base, W, H - base);
    for (let i = i0; i <= i1; i++) {
      if (hash(i * 7 + seed) < 0.3) continue;
      const w = seg * (0.45 + hash(i * 13 + seed) * 0.6), h = 40 + hash(i * 17 + seed) * 120;
      const x = i * seg - off + (seg - w) / 2;
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.moveTo(x - 24, base + 1); ctx.lineTo(x, base - h); ctx.lineTo(x + w, base - h); ctx.lineTo(x + w + 24, base + 1); ctx.fill();
      ctx.fillStyle = rim;
      ctx.fillRect(x, base - h, w, 2);
      ctx.beginPath(); ctx.moveTo(x + w, base - h); ctx.lineTo(x + w + 24, base + 1); ctx.lineTo(x + w + 18, base + 1); ctx.lineTo(x + w - 3, base - h + 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(x + w * 0.15, base - h * 0.6, w * 0.7, 2); ctx.fillRect(x + w * 0.25, base - h * 0.35, w * 0.5, 2);
    }
  };
  const M1 = [[0, '#1c1a4a', '#141235', '#3a4288'], [0.5, '#3a2f70', '#281f55', '#8a7ac8'], [0.8, '#6a3f78', '#4a2b5c', '#ffa080'], [1, '#a9a0c8', '#8c80b0', '#fff0d0']];
  mesa(0.14, 420, 230, 1, rgb(keyed(M1, p, 1)), rgb(keyed(M1, p, 2)), rgba(keyed(M1, p, 3), 0.8));
  const M2 = [[0, '#241a50', '#160f38', '#4a4f98'], [0.5, '#46306e', '#2c1c50', '#9a86d0'], [0.8, '#7a3f6e', '#522650', '#ffb08a'], [1, '#c2a2b8', '#9c7c98', '#ffe8c8']];
  mesa(0.3, 462, 170, 9, rgb(keyed(M2, p, 1)), rgb(keyed(M2, p, 2)), rgba(keyed(M2, p, 3), 0.85));
  // 手前の丘 + ひかり草
  const f = 0.5, off = camX * f, base = 505;
  const hy = x => base - 30 - Math.sin((x + off) * 0.006) * 26 - Math.sin((x + off) * 0.017) * 10;
  const HC = [[0, '#2a1846', '#180c2e'], [0.5, '#4a2a5e', '#2c1640'], [0.8, '#6d3f6e', '#4a2650'], [1, '#c69aa8', '#a07a90']];
  const hg2 = ctx.createLinearGradient(0, base - 70, 0, H);
  hg2.addColorStop(0, rgb(keyed(HC, p, 1))); hg2.addColorStop(1, rgb(keyed(HC, p, 2)));

  ctx.beginPath(); ctx.moveTo(0, H);

  ctx.lineTo(W, H); ctx.fill();
  const seg = 70;
  for (let i = Math.floor(off / seg) - 1; i <= Math.floor((off + W) / seg) + 1; i++) {

    const x = i * seg - off + hash(i) * 40, y0 = hy(x), h = 18 + hash(i * 5.5) * 34;
    ctx.strokeStyle = rgb(keyed(HC, p, 2)); ctx.lineWidth = 2;

    const gg = ctx.createRadialGradient(x + 2, y0 - h, 1, x + 2, y0 - h, 10);
    gg.addColorStop(0, `rgba(255,224,140,${0.5 + glow * 0.4})`); gg.addColorStop(1, 'rgba(255,200,120,0)');

    if (x > W) continue;
    const y = m.y + Math.sin(G.frame * 0.02 + m.x) * 10;

// いちばん手前の草のシルエット (奥行きを出す)
function drawForeground(camX) {
  const p = dawnLevel();
  const col = rgb(keyed([[0, '#07040f', '#07040f'], [0.6, '#160a22', '#160a22'], [1, '#3a2034', '#3a2034']], p, 1));
  const off = camX * 1.25, seg = 46;
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round';
  for (let i = Math.floor(off / seg) - 1; i <= Math.floor((off + W) / seg) + 1; i++) {
    const r = hash(i * 2.7 + 5);
    if (r < 0.55) continue;
    const x = i * seg - off + hash(i) * 20;
    const h = 16 + hash(i * 1.9) * 34;
    ctx.lineWidth = 3;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath(); ctx.moveTo(x + k * 4, H + 2);
      ctx.quadraticCurveTo(x + k * 7, H - h * 0.6, x + k * 9 + Math.sin(G.frame * 0.03 + i) * 2, H - h * (1 - Math.abs(k) * 0.18)); ctx.stroke();
    }

    }

// ひかりの輪 (ループ)
function drawLoop(lp, camX) {
  const x = lp.cx - camX;
  if (x < -200 || x > W + 200) return;
  const g = ctx.createLinearGradient(x - lp.r, 0, x + lp.r, 0);
  g.addColorStop(0, '#c48a64'); g.addColorStop(0.5, PAL.stoneLight); g.addColorStop(1, '#b77c58');
  ctx.lineWidth = 22; ctx.strokeStyle = '#6e4430';
  ctx.beginPath(); ctx.arc(x, lp.cy, lp.r + 11, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 15; ctx.strokeStyle = g; ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,240,220,0.7)';
  ctx.beginPath(); ctx.arc(x, lp.cy, lp.r + 5, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2 + G.frame * 0.012;
    const px = x + Math.cos(a) * (lp.r + 11), py = lp.cy + Math.sin(a) * (lp.r + 11);
    const al = 0.5 + 0.5 * Math.sin(G.frame * 0.1 + i);
    ctx.fillStyle = `rgba(255,224,138,${al * 0.35})`; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,240,190,${al})`; ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill();
  }
  // 走ったところが光る / 一回転すると輪全体がかがやく
  if (lp.lit > 0 || lp.flash > 0) {
    const fl = (lp.flash || 0) / 40;
    ctx.save();
    ctx.shadowColor = '#ffd36e'; ctx.shadowBlur = 18 + fl * 20;
    ctx.strokeStyle = `rgba(255,236,150,${0.75 + fl * 0.25})`; ctx.lineWidth = 7 + fl * 6; ctx.lineCap = 'round';
    ctx.beginPath();
    if (fl > 0) ctx.arc(x, lp.cy, lp.r + 11, 0, Math.PI * 2);
    else ctx.arc(x, lp.cy, lp.r + 11, Math.PI / 2, Math.PI / 2 - Math.min(lp.lit, Math.PI * 2), true);
    ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#6e4430'; rr(x - 42, lp.cy + lp.r - 5, 84, 9, 3); ctx.fill();
  ctx.fillStyle = PAL.stone; rr(x - 40, lp.cy + lp.r - 5, 80, 5, 3); ctx.fill();
}

// 日の出の祭壇 (ゴール)
function drawGoal(camX) {
  const cx = L.goalX * T + T / 2 - camX, gy = L.goalY;
  if (cx < -300 || cx > W + 300) return;
  const ringY = gy - 150, R = 66;
  for (const s of [-1, 1]) {
    const px = cx + s * (R + 14);
    const g = ctx.createLinearGradient(px - 13, 0, px + 13, 0);
    g.addColorStop(0, PAL.stoneLight); g.addColorStop(0.6, PAL.stone); g.addColorStop(1, PAL.stoneDark);
    ctx.fillStyle = '#6e4430'; rr(px - 13, ringY - 10, 26, gy - ringY + 10, 6); ctx.fill();
    ctx.fillStyle = g; rr(px - 11, ringY - 10, 21, gy - ringY + 8, 6); ctx.fill();
    ctx.fillStyle = '#6e4430'; rr(px - 17, ringY - 18, 34, 12, 4); ctx.fill();
    ctx.fillStyle = PAL.stoneLight; rr(px - 15, ringY - 17, 30, 4, 2); ctx.fill();
  }
  if (L.beam > 0) {
    const bw = 34 + L.sunrise * 40;
    const bg = ctx.createLinearGradient(0, 0, 0, gy);
    bg.addColorStop(0, 'rgba(255,240,180,0)'); bg.addColorStop(1, `rgba(255,220,130,${0.6 * L.beam})`);
    ctx.fillStyle = bg; ctx.fillRect(cx - bw / 2, 0, bw, gy);
  }
  const donut = G.char === 'croc';   // ワニのときは「ドーナツの祭壇」
  ctx.save();
  if (L.beam > 0) { ctx.shadowColor = '#ffd36e'; ctx.shadowBlur = 30 * L.beam; }
  if (donut) drawDonut(cx, ringY, R, L.beam);
  else {
    ctx.strokeStyle = '#6e4430'; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.arc(cx, ringY, R, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = L.beam > 0 ? mix('#dba57c', '#ffe08a', L.beam) : PAL.stone; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(cx, ringY, R, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = PAL.stoneDark;
  for (let i = 0; i < 12 && !donut; i++) {
    const a = i / 12 * Math.PI * 2;
    ctx.save(); ctx.translate(cx + Math.cos(a) * (R + 10), ringY + Math.sin(a) * (R + 10)); ctx.rotate(a + Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(0, -9); ctx.lineTo(4, 0); ctx.fill(); ctx.restore();
  }
  ctx.fillStyle = '#6e4430'; rr(cx - 52, gy - 10, 104, 12, 4); ctx.fill();
  ctx.fillStyle = PAL.stone; rr(cx - 50, gy - 10, 100, 7, 4); ctx.fill();
  if (donut) { ctx.save(); ctx.translate(cx, gy - 6); ctx.scale(0.09, 0.09); drawDonut(0, 0, 40, 0); ctx.restore(); }

}
// ドーナツ (ふっくらした生地 + ピンクのアイシング + カラフルなトッピング)
function drawDonut(cx, cy, R, beam) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#7a4320'; ctx.lineWidth = R * 0.62;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = mix('#d9924a', '#ffc77a', beam || 0); ctx.lineWidth = R * 0.54;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  // アイシング (ふちが波うつ)
  ctx.fillStyle = mix('#ff8fb8', '#ffb3d1', beam || 0);
  ctx.beginPath();
  for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2, r = R + R * 0.2 + Math.sin(i * 1.7) * R * 0.035; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  for (let i = 48; i >= 0; i--) { const a = i / 48 * Math.PI * 2, r = R - R * 0.2 - Math.sin(i * 2.3) * R * 0.03; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = R * 0.06;
  ctx.beginPath(); ctx.arc(cx, cy, R + R * 0.08, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
  // トッピング
  const cols = ['#ffffff', '#ffd23f', '#5ec8ff', '#7ee08a', '#8a5cff', '#ff5d5d'];
  for (let i = 0; i < 26; i++) {
    const a = hash(i * 3.1) * Math.PI * 2, r = R + (hash(i * 5.7) - 0.5) * R * 0.3;
    ctx.save(); ctx.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.rotate(hash(i * 1.9) * Math.PI);
    ctx.fillStyle = cols[i % cols.length]; rr(-R * 0.06, -R * 0.018, R * 0.12, R * 0.036, R * 0.018); ctx.fill();
    ctx.restore();
  }
}

function drawCheckpoints(camX) {
  L.cps.forEach((cpx, idx) => {
    const x = cpx * T + 12 - camX, gy = 15 * T;

}

function drawPlat(p, camX) { // 浮き岩

// ---------- 夜の暗さ: 主人公やランタンのまわりだけ明るい ----------
function drawLighting(camX) {
  const p = dawnLevel();
  const night = 0.78 * (1 - smooth(0.05, 0.86, p));
  if (night < 0.01) return;
  const lc = lctx;
  lc.globalCompositeOperation = 'source-over';
  lc.clearRect(0, 0, W, H);
  const g = lc.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(4,6,30,${night * 0.25})`); g.addColorStop(0.5, `rgba(4,6,30,${night * 0.7})`); g.addColorStop(1, `rgba(4,4,24,${night})`);
  lc.fillStyle = g; lc.fillRect(0, 0, W, H);
  lc.globalCompositeOperation = 'destination-out';
  const light = (x, y, r, a = 1) => {
    if (x < -r || x > W + r) return;
    const rg = lc.createRadialGradient(x, y, r * 0.15, x, y, r);
    rg.addColorStop(0, `rgba(0,0,0,${a})`); rg.addColorStop(0.55, `rgba(0,0,0,${a * 0.6})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
    lc.fillStyle = rg; lc.beginPath(); lc.arc(x, y, r, 0, Math.PI * 2); lc.fill();
  };
  if (P && G.mode !== 'title' && !P.hidden) {
    const hx = (P.loop ? P.feetX : P.x + P.w / 2) - camX, hy = (P.loop ? P.feetY : P.y + P.h) - 40;
    light(hx, hy, P.star > 0 ? 300 : 220 + Math.sin(G.frame * 0.05) * 6);
  } else if (G.mode === 'title') light(W / 2, 330, 260);
  L.cps.forEach((c, i) => light(c * T + 24 - camX, 15 * T - 60, G.cpi >= i ? 150 : 60, G.cpi >= i ? 1 : 0.5));
  const tx0 = Math.max(0, Math.floor(camX / T)), tx1 = Math.min(L.LW - 1, tx0 + Math.ceil(W / T) + 1);
  for (let ty = 0; ty < L.LH; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const c = L.grid[ty][tx];
    if (c === 'o') light(tx * T + 16 - camX, ty * T + 16, 40, 0.8);
    else if (c === 'Q' || c === 'M') light(tx * T + 16 - camX, ty * T + 18, 70, 0.9);
    else if (c === '>') light(tx * T + 16 - camX, ty * T + 28, 45, 0.7);
  }
  for (const it of L.items) if (it.kind !== 'droppop') light(it.x + 8 - camX, it.y + 8, 40, 0.8);
  for (const lp of L.loops) light(lp.cx - camX, lp.cy, lp.r + 50, 0.45);
  const gx = L.goalX * T + 16 - camX;
  light(gx, L.goalY - 150, 140, 0.5 + L.beam * 0.5);
  ctx.drawImage(lightCv, 0, 0);
  // 主人公の暖かい光
  if (P && G.mode !== 'title' && !P.hidden && !P.dead) {
    const hx = (P.loop ? P.feetX : P.x + P.w / 2) - camX, hy = (P.loop ? P.feetY : P.y + P.h) - 40;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const wg = ctx.createRadialGradient(hx, hy, 10, hx, hy, 150);
    wg.addColorStop(0, `rgba(255,170,60,${0.16 * night})`); wg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = wg; ctx.fillRect(hx - 150, hy - 150, 300, 300);
    ctx.restore();
  }
}

function drawWorld() {
  const camX = Math.round(L.camX);
  drawBG(camX);
  drawGoal(camX);
  for (const lp of L.loops) drawLoop(lp, camX);
  for (const it of L.items) if (it.kind === 'sun' && it.rise > 0) drawItem(it, camX);
  for (let i = Math.floor(camX / (CHUNK * T)); i <= Math.floor((camX + W) / (CHUNK * T)); i++) {
    if (i * CHUNK < L.LW) ctx.drawImage(chunkCanvas(i), i * CHUNK * T - camX, 0);
  }
  const tx0 = Math.max(0, Math.floor(camX / T)), tx1 = Math.min(L.LW - 1, tx0 + Math.ceil(W / T) + 1);
  for (let ty = 0; ty < L.LH; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const c = L.grid[ty][tx];
    if (c === ' ' || STATIC(c)) continue;
    const b = L.bumps.get(tx + ',' + ty);
    const off = b ? -Math.sin((10 - b) / 10 * Math.PI) * 9 : 0;
    drawTile(c, tx * T - camX, ty * T + off, tx, ty);
  }
  drawCheckpoints(camX);
  for (const p of L.plats) drawPlat(p, camX);
  for (const it of L.items) if (!(it.kind === 'sun' && it.rise > 0)) drawItem(it, camX);
  for (const e of L.enemies) if (e.active || e.x < camX + W) drawEnemy(e, camX);
  if (P && !P.hidden && G.mode !== 'title') {
    const blink = G.mode === 'play' && ((P.star > 0 && P.star < 120) || P.hurt > 0) && G.frame % 6 < 3;
    if (!blink) {
      let fx = P.loop ? P.feetX : P.x + P.w / 2, fy = P.loop ? P.feetY : P.y + P.h;
      if (P.charging) {
        // ためオーラ + プルプル
        const r = 30 + P.charge * 22, cx = fx - camX, cy = fy - 34;
        const ag = ctx.createRadialGradient(cx, cy, 4, cx, cy, r);
        ag.addColorStop(0, `rgba(255,236,150,${0.15 + P.charge * 0.35})`); ag.addColorStop(1, 'rgba(255,180,60,0)');
        ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = `rgba(255,230,140,${0.4 + 0.4 * Math.sin(G.frame * 0.5)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, r * (0.6 + 0.4 * ((G.frame % 12) / 12)), 0, Math.PI * 2); ctx.stroke();
        const amp = 1 + P.charge * 2.5;
        fx += (G.frame % 2 ? 1 : -1) * amp; fy += (Math.random() - 0.5) * amp * 0.6;
      }
      drawHero(fx - camX, fy, {
        face: P.face, walk: P.walk, air: !P.onGround && !P.dead && !P.loop, rot: P.dead ? 0 : P.rot,
        happy: P.star > 0 || (G.mode === 'goal' && L.goalPhase >= 1) || G.mode === 'clear',
        glow: P.star > 0 || P.dash > 0 || (P.charging && P.charge >= 1) || (G.mode === 'goal' && L.goalPhase >= 2), dead: P.dead,
      });
    }
  }
  for (const p of L.parts) {
    const x = p.x - camX;
    if (p.kind === 'puff') {
      ctx.globalAlpha = p.t / 32; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    } else if (p.kind === 'gather') {
      ctx.fillStyle = `rgba(255,240,170,${p.t / 14})`; ctx.beginPath(); ctx.arc(x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'spark') {
      ctx.globalAlpha = Math.min(1, p.t / 30); drawSunIcon(x, p.y, 2, '#fff3a0'); ctx.globalAlpha = 1;
    } else if (p.kind === 'ring') {
      ctx.globalAlpha = p.t / 16; ctx.strokeStyle = '#ffe6a0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, p.y, 4 + (16 - p.t) * 1.2, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (p.kind === 'petal') {
      ctx.save(); ctx.translate(x, p.y); ctx.rotate(G.frame * 0.05 + p.vx * 3);
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  }
  drawForeground(camX);
  drawLighting(camX);
  drawGloomBubbles(camX);
  for (const s of L.pops) {
    ctx.globalAlpha = Math.min(1, s.t / 20);
    text(s.text, s.x - camX, s.y, 15, s.color || '#fff');
    ctx.globalAlpha = 1;
  }
}

  bg.addColorStop(t, '#fff6cf'); bg.addColorStop(clamp(t + 0.08, 0, 1), '#e8b84a'); bg.addColorStop(1, '#c9962e');
  ctx.strokeStyle = bg; ctx.lineWidth = 2.5; rr(cx - w / 2, y - h / 2, w, h, h / 2); ctx.stroke();
  // 文字: 「30」だけ少し大きく
  ctx.font = '900 17px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
  const a = 'てるしのワークセンター ', c = ' 周年';
  const wa = ctx.measureText(a).width, wc = ctx.measureText(c).width;
  ctx.font = '900 25px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
  const wb = ctx.measureText('30').width;
  let x = cx - (wa + wb + wc) / 2;
  text(a, x, y + 1, 17, '#ffe7a8', 'left', '#2a1640'); x += wa;
  text('30', x, y, 25, '#ffd24a', 'left', '#2a1640'); x += wb;
  text(c, x, y + 1, 17, '#ffe7a8', 'left', '#2a1640');
}
// タイトルのまわりで、ときどき小さな星がまたたく
// 文字の上には出さない (バッジ・タイトル・サブタイトルの文字の範囲をよける)
const TITLE_SPARKS = Array.from({ length: 60 }, (_, i) => ({ dx: (hash(i * 3.7) - 0.5) * 600, y: 8 + hash(i * 5.1) * 180, ph: hash(i * 9.3) * 6.28, sp: 0.03 + hash(i * 1.7) * 0.03, r: 1.6 + hash(i * 2.3) * 1.8 }))
  .filter(p => !((Math.abs(p.dx) < 158 && p.y > 14 && p.y < 48) || (Math.abs(p.dx) < 232 && p.y > 92 && p.y < 150) || (Math.abs(p.dx) < 190 && p.y > 160 && p.y < 186)))
  .slice(0, 16);
function drawTitleSparkles(cx) {
  for (const s of TITLE_SPARKS) {
    const v = Math.sin(G.frame * s.sp + s.ph);
    if (v <= 0.35) continue;
    const k = (v - 0.35) / 0.65;
    sparkle(cx + s.dx, s.y, s.r * (0.6 + k * 0.6), k * 0.85);
  }
}

function uiButton(label, x, y, w, h, act, selected, color = '#ffc61a') {
  UI.push({ x, y, w, h, act });
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, selected ? 'rgba(255,214,120,0.95)' : 'rgba(70,50,120,0.9)');
  g.addColorStop(1, selected ? 'rgba(230,150,60,0.95)' : 'rgba(36,24,72,0.9)');
  ctx.fillStyle = g; rr(x, y, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = selected ? '#fff6e0' : color; ctx.lineWidth = selected ? 3 : 2; ctx.stroke();
  text(label, x + w / 2, y + h / 2 + 1, 20, selected ? '#2a1640' : '#fff6e6', 'center', selected ? 'rgba(255,255,255,0.6)' : '#1c0f30');
}
// 一時停止ボタン (右上)
function drawPauseButton() {
  const s = 44, x = W - 16 - s, y = 62;
  UI.push({ x: x - 6, y: y - 6, w: s + 12, h: s + 12, act: 'pause' });
  ctx.fillStyle = 'rgba(30,18,58,0.55)'; ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s / 2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,170,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff6e6'; rr(x + 14, y + 12, 6, 20, 2); ctx.fill(); rr(x + 24, y + 12, 6, 20, 2); ctx.fill();
}

    const badge = (r, x, y, size) => {
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(x, y, size * 0.62, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = RANK_COL[r]; ctx.lineWidth = 3; ctx.stroke();
      text(r, x, y + 1, size, RANK_COL[r], 'center');
    };
    const lx = cx - 70, rxx = cx + 230;
    text('クリアタイム', lx, 150, 15, '#cfd8ff');
    text(fmtTime(G.final), lx, 182, 32, '#ffffff');
    if (ct > 20) badge(R0.tr, rxx, 172, 30);
    if (G.newRecord && G.frame % 40 < 28) text('NEW RECORD!', lx + 210, 150, 14, '#ffe066', 'right');
    text('スコア', lx, 224, 15, '#cfd8ff');
    text(String(G.score), lx, 256, 32, '#ffe6a8');
    if (ct > 45) badge(R0.sr, rxx, 246, 30);
    if (G.newHigh && G.frame % 40 < 28) text('HIGH SCORE!', lx + 210, 224, 14, '#ffe066', 'right');
    ctx.strokeStyle = 'rgba(255,220,170,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, 292); ctx.lineTo(rxx + 30, 292); ctx.stroke();
    text('総合ランク', lx, 335, 20, '#ffffff');
    if (ct > 75) {
      const k = Math.min(1, (ct - 75) / 12), sz = 64 + (1 - k) * 60;
      ctx.globalAlpha = k; badge(R0.total, rxx - 30, 330, sz); ctx.globalAlpha = 1;
      if (ct === 76) sfx.rank();
    }
    text(`ベスト ${fmtTime(G.best)}　ハイスコア ${G.high}`, lx, 392, 14, '#bfe8ff');
    if (G.wait <= 0 && G.frame % 60 < 42) text(backMsg, cx, 450, 18, '#fff', 'center');
  }
}

// ---------- メインループ (60fps 固定ステップ) ----------
let last = performance.now(), accT = 0;
function loop(now) {
  accT += Math.min(100, now - last); last = now;
  while (accT >= 1000 / 60) { update(); accT -= 1000 / 60; }
  render();
  if (G.frame % 30 === 0) placeCtrl();
  requestAnimationFrame(loop);
}
loadLevel();
requestAnimationFrame(loop);
</script>
