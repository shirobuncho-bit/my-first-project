<title>ぴょこぴょこジャンプ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f3ea;--fg:#1d1a12;--sub:#6b6552;--card:#fff;--line:#e0dac8;--accent:#f2b800;--ink:#1d1a12;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110b;--fg:#f4efe0;--sub:#a39c86;--card:#1d1a11;--line:#37331f;--accent:#ffcc1f;--ink:#13110b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13110b;--fg:#f4efe0;--sub:#a39c86;--card:#1d1a11;--line:#37331f;--accent:#ffcc1f;--ink:#13110b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:440px;margin:0 auto;display:grid;gap:14px}
h1{font-size:22px;margin:0}
.stage{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:2/3;background:#111;touch-action:manipulation;cursor:pointer}
canvas{display:block;width:100%;height:100%}
.start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);border:0;color:#fff;font-weight:700;font-size:20px;font-family:inherit;cursor:pointer}
.start[hidden]{display:none}
.bgs{display:flex;flex-wrap:wrap;gap:8px}
.bgs button,.bgs label.pick{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.bgs button[aria-pressed=true]{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.bgs input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.cap{font-size:13px;color:var(--sub);margin:0 0 -4px}
.start span{background:var(--accent);color:var(--ink);padding:12px 22px;border-radius:999px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:4.5em 1fr 3em;align-items:center;gap:10px;font-size:14px}
.row output{color:var(--sub);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggles label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.toggles input{accent-color:var(--accent)}
.hint{color:var(--sub);font-size:13px;margin:0}
button.act{font:inherit;font-weight:700;background:var(--accent);color:var(--ink);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<main>
<h1>ぴょこぴょこジャンプ</h1>
<div class="stage" id="stage">
<canvas id="cv" width="512" height="768" aria-label="飛び跳ねる黄色いキャラクター"></canvas>
<button class="start" id="start"><span>タップして始める</span></button>
</div>
<div class="panel">
<div class="toggles">
<label><input type="checkbox" id="auto" checked>くり返す</label>
<label><input type="checkbox" id="snd" checked>効果音</label>
</div>
<p class="cap">背景</p>
<div class="bgs" id="bgs">
<button type="button" data-bg="orig" aria-pressed="true">元の背景</button>
<button type="button" data-bg="sky" aria-pressed="false">青空</button>
<button type="button" data-bg="sunset" aria-pressed="false">夕焼け</button>
<button type="button" data-bg="night" aria-pressed="false">夜空</button>
<button type="button" data-bg="pop" aria-pressed="false">ポップ</button>
<label class="pick" for="bgfile">画像を選ぶ</label><input type="file" id="bgfile" accept="image/*">
</div>
<div class="row"><label for="hgt">高さ</label><input type="range" id="hgt" min="0" max="200" value="100"><output id="hgtv">100%</output></div>
<div class="row"><label for="spd">速さ</label><input type="range" id="spd" min="50" max="200" value="100"><output id="spdv">100%</output></div>
<p class="hint">「くり返す」を外すと止まります。キャラをタップすると1回跳びます。</p>
</div>
</main>

const ease=t=>t*t*(3-2*t);
function pose(t){
 if(t<.18){const k=ease(t/.18);return[0,1+.10*k,1-.16*k,0]}
 if(t<.28){const k=(t-.18)/.10;return[0,1.10-.20*k,.84+.30*k,0]}
 if(t<.78){const k=(t-.28)/.50,h=4*k*(1-k),st=k<.5?1.14-.14*Math.min(1,k*2):1+.07*(k-.5)*2;return[h,1/Math.sqrt(st),st,.05*Math.sin(2*Math.PI*k)]}
 if(t<.90){const k=Math.sin((t-.78)/.12*Math.PI/2);return[0,1+.16*k,1-.20*k,0]}
 const k=ease((t-.90)/.10);return[0,1.16-.06*k,.80+.04*k,0]
}

const bgCanvas=document.createElement("canvas");bgCanvas.width=512;bgCanvas.height=768;
function rng(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function vgrad(c,stops){const g=c.createLinearGradient(0,0,0,768);stops.forEach(([p,col])=>g.addColorStop(p,col));c.fillStyle=g;c.fillRect(0,0,512,768)}
function cloud(c,x,y,s){c.fillStyle="rgba(255,255,255,.92)";c.beginPath();for(const[dx,dy,r]of[[0,0,34],[34,-12,40],[72,0,32],[36,10,38]])c.arc(x+dx*s,y+dy*s,r*s,0,7),c.closePath();c.fill()}
function hills(c,col,y,amp,ph){c.fillStyle=col;c.beginPath();c.moveTo(0,768);for(let x=0;x<=512;x+=8)c.lineTo(x,y+Math.sin(x/90+ph)*amp);c.lineTo(512,768);c.closePath();c.fill()}
const BGS={
 sky(c){vgrad(c,[[0,"#4aa8ee"],[.7,"#b9e4fb"],[1,"#e8f7ff"]]);cloud(c,40,120,1.1);cloud(c,300,210,.8);cloud(c,150,420,.7);cloud(c,370,500,.9);hills(c,"#7fcf62",650,16,0);hills(c,"#58b24a",700,14,2)},
 sunset(c){vgrad(c,[[0,"#5b3b8c"],[.45,"#e0597d"],[.8,"#ffb457"],[1,"#ffd58a"]]);const g=c.createRadialGradient(256,560,10,256,560,300);g.addColorStop(0,"rgba(255,240,170,.95)");g.addColorStop(1,"rgba(255,200,120,0)");c.fillStyle=g;c.fillRect(0,0,512,768);cloud(c,60,150,.9);cloud(c,330,260,.7);hills(c,"#3a2548",680,18,1);hills(c,"#241530",730,12,3)},
 night(c){vgrad(c,[[0,"#070b24"],[1,"#25306b"]]);const r=rng(7);for(let i=0;i<110;i++){c.fillStyle=`rgba(255,255,230,${.35+r()*.65})`;c.beginPath();c.arc(r()*512,r()*700,.6+r()*1.8,0,7);c.fill()}const m=c.createRadialGradient(410,130,5,410,130,90);m.addColorStop(0,"rgba(255,250,210,1)");m.addColorStop(.35,"rgba(255,250,210,.9)");m.addColorStop(1,"rgba(255,250,210,0)");c.fillStyle=m;c.fillRect(250,0,262,300);hills(c,"#0d1233",700,14,0.5)},
 pop(c){c.fillStyle="#ff7eb6";c.fillRect(0,0,512,768);c.save();c.translate(256,420);for(let i=0;i<16;i++){c.rotate(Math.PI/8);c.fillStyle=i%2?"rgba(255,255,255,.14)":"rgba(255,255,255,0)";c.beginPath();c.moveTo(0,0);c.lineTo(-420,-1100);c.lineTo(420,-1100);c.closePath();c.fill()}c.restore();c.fillStyle="rgba(255,255,255,.35)";for(let y=0;y<780;y+=48)for(let x=(y/48%2)*24;x<530;x+=48){c.beginPath();c.arc(x,y,7,0,7);c.fill()}}
};
function setBg(name){const c=bgCanvas.getContext("2d");c.clearRect(0,0,512,768);
 if(name==="orig")c.drawImage(imgs.bg,0,0,512,768);else if(BGS[name])BGS[name](c);

const EX=150,EY=201,ECX=239,ECY=227.5,BLINK=190;
let nextBlink=performance.now()+1200,blinkAt=0,blinking=false;
function eyeK(now){
 if(!blinking&&now>=nextBlink){blinking=true;blinkAt=now}
 if(!blinking)return 1;
 const p=(now-blinkAt)/BLINK;
 if(p>=1){blinking=false;nextBlink=now+(Math.random()<.25?140:2000+Math.random()*2600);return 1}
 return 1-.93*Math.sin(Math.PI*p)}
function drawEyes(){
 const k=eyeK(performance.now());
 ctx.save();ctx.translate(ECX-AX,ECY-AY);ctx.scale(1,k);ctx.drawImage(imgs.eyes,EX-ECX,EY-ECY);ctx.restore()}

let ac=null;
function audio(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==="suspended")ac.resume();return ac}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+d)}
function osc(type,f0,f1,t,d,peak,a=.01){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);env(g,t,a,peak,d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function sfxJump(){if(!ac)return;const t=ac.currentTime;osc("triangle",450,1950,t,.16,.28);osc("sine",900,3900,t,.16,.08)}
function sfxSpark(){if(!ac)return;const t=ac.currentTime;osc("sine",2600,3400,t,.1,.05)}
function sfxLand(){if(!ac)return;const t=ac.currentTime;
 osc("sine",140,60,t,.14,.5,.003);
 const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/ac.sampleRate*60);
 n.buffer=b;const g=ac.createGain();g.gain.value=.15;n.connect(g).connect(ac.destination);n.start(t);
 osc("triangle",520,260,t+.03,.3,.14);osc("triangle",260,520,t+.18,.2,.07)}
// ---- アニメーション ----
let phase=0,last=0,running=false,once=false,started=false;
const EV=[[.22,sfxJump],[.50,sfxSpark],[.78,sfxLand]];
function fire(a,b){for(const[p,f]of EV){if(a<p&&b>=p&&$("snd").checked)f()}}
function draw(t){
 const hs=$("hgt").value/100,[h,sx,sy,rot]=pose(t),hh=h;
 ctx.clearRect(0,0,512,768);
 ctx.drawImage(bgCanvas,0,0,512,768);
 // 影
 ctx.save();ctx.translate(AX-15,AY+5);
 const sc=1-.4*hh;ctx.scale(115*sc*sx,14*(1-.4*hh));
 const g=ctx.createRadialGradient(0,0,0,0,0,1);const al=.7-.4*hh;
 g.addColorStop(0,`rgba(0,0,0,${al})`);g.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,1,0,7);ctx.fill();ctx.restore();
 // 本体
 const up=h*H0*hs;
 ctx.save();ctx.translate(AX,AY-up);ctx.rotate(rot);ctx.scale(sx,sy);ctx.drawImage(imgs.body,-AX,-AY);drawEyes();ctx.restore();
 // 動き線
 if(t>.2&&t<.85){ctx.save();ctx.globalAlpha=(Math.floor(performance.now()/90)%2)?.9:.5;ctx.drawImage(imgs.lines,0,-up*.6+(t<.5?15:-5));ctx.restore()}
}
function tick(now){
 const dur=1000/($("spd").value/100);
 if(running){
  const dt=Math.min(now-last,60);const np=phase+dt/dur;
  if(np>=1){fire(phase,1);phase=np-1;fire(0,phase);
   if(!$("auto").checked){running=false;phase=0}}
  else{fire(phase,np);phase=np}
 }
 last=now;draw(phase);requestAnimationFrame(tick)
}
function jump(){if(!started)return;audio();if(!running){running=true;phase=0}}
$("start").addEventListener("click",e=>{e.stopPropagation();started=true;$("start").hidden=true;audio();running=true;phase=0});
$("stage").addEventListener("click",()=>{if(!$("auto").checked)jump()});
$("auto").addEventListener("change",()=>{if(started&&$("auto").checked&&!running){running=true}});
for(const[id,o]of[["hgt","hgtv"],["spd","spdv"]]){const f=()=>$(o).textContent=$(id).value+"%";$(id).addEventListener("input",f);f()}
</script>
